<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>식단 관리자</title><link rel="stylesheet" href="style.css"></head>
<body><div class="admin-wrap">
<section class="hero"><div class="logo">👩‍🍳</div><div class="title">식단 관리자</div><div class="subtitle">엑셀파일을 올리면 메뉴가 업데이트됩니다.</div></section>
<section id="loginCard" class="admin-card">
<h2>🔐 관리자 로그인</h2><p class="small">관리자 계정으로 로그인해야 메뉴를 수정할 수 있습니다.</p>
<input id="email" type="email" placeholder="관리자 이메일" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:10px">
<input id="password" type="password" placeholder="비밀번호" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:8px">
<button class="action" id="loginBtn">로그인</button><div id="loginStatus" class="status"></div>
</section>
<section id="uploadCard" class="admin-card hidden">
<h2>📁 새 식단 업로드</h2><p class="small">현재 사용 중인 주간 메뉴 엑셀파일(.xlsx)을 그대로 선택하세요.</p>
<input id="file" type="file" accept=".xlsx,.xls">
<button class="action secondary" id="previewBtn">1. 엑셀 미리보기</button>
<div id="preview" class="preview hidden"></div>
<button class="action" id="uploadBtn" disabled>2. 메뉴 업데이트</button>
<div id="status" class="status"></div>
<button class="action secondary" id="logoutBtn">로그아웃</button>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let parsed=[];
async function refresh(){
 const {data,error}=await sb.auth.getSession();
 if(error){$('loginStatus').textContent=error.message;return}
 const logged=!!data.session;
 $('loginCard').classList.toggle('hidden',logged);
 $('uploadCard').classList.toggle('hidden',!logged);
}
sb.auth.onAuthStateChange(()=>refresh());
$('loginBtn').onclick=async()=>{
 const email=$('email').value.trim(), password=$('password').value;
 if(!email||!password){$('loginStatus').textContent='이메일과 비밀번호를 입력하세요.';return}
 $('loginBtn').disabled=true;$('loginStatus').textContent='로그인 중...';
 const {error}=await sb.auth.signInWithPassword({email,password});
 $('loginStatus').textContent=error?'로그인 실패: '+error.message:'로그인 성공!';
 $('loginBtn').disabled=false;await refresh();
};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();await refresh()};
function dateKey(v){
 if(v instanceof Date&&!isNaN(v)){return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`}
 if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
 return String(v||'').trim();
}
function clean(v){return String(v??'').replace(/\r/g,'').trim()}
$('previewBtn').onclick=async()=>{
 const f=$('file').files[0];if(!f){$('status').textContent='엑셀파일을 선택하세요.';return}
 try{
  const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  if(rows.length<3)throw new Error('엑셀 내용이 너무 적습니다.');
  const header=rows[1]||[],dateCols=[];
  for(let c=0;c<header.length;c++){const k=dateKey(header[c]);if(/^\d{4}-\d{2}-\d{2}$/.test(k))dateCols.push([c,k])}
  if(!dateCols.length)throw new Error('2번째 행에서 날짜를 찾지 못했습니다.');
  parsed=[];let meal=null,sub=null,order=0;
  for(let r=2;r<rows.length;r++){
   const a=clean(rows[r]?.[0]),b=clean(rows[r]?.[1]),c=clean(rows[r]?.[2]);
   if(a==='조식'||a==='중식'||a==='석식'){meal=a;sub=null;order=0}
   if(b==='멀티바'){if(meal==='석식')sub='석식 멀티바';else if(meal==='중식')sub='멀티바'}
   if(meal==='중식'&&(c==='샐러드'||c==='샌드위치'||c==='콤보'))sub=c;
   if(b==='원 산 지'||a==='원 산 지')break;
   if(!meal)continue;
   for(const [col,k] of dateCols){
    const value=clean(rows[r]?.[col]);if(!value)continue;
    parsed.push({menu_date:k,meal_type:meal,sub_type:sub,menu_name:value,sort_order:order++});
   }
  }
  if(!parsed.length)throw new Error('메뉴를 찾지 못했습니다. 엑셀 형식을 확인해주세요.');
  const grouped={};parsed.forEach(x=>(grouped[x.menu_date]??=[]).push(x));const dates=Object.keys(grouped).sort();
  $('preview').classList.remove('hidden');
  $('preview').innerHTML='<table><tr><th>날짜</th><th>조식</th><th>중식</th><th>석식</th><th>총 메뉴</th></tr>'+
   dates.map(d=>{const list=grouped[d];return `<tr><td>${d}</td><td>${list.filter(x=>x.meal_type==='조식').length}</td><td>${list.filter(x=>x.meal_type==='중식').length}</td><td>${list.filter(x=>x.meal_type==='석식').length}</td><td>${list.length}</td></tr>`}).join('')+'</table>';
  $('status').textContent=`총 ${dates.length}일 / ${parsed.length}개 메뉴를 확인했습니다.\n\n하위 메뉴 자동 구분: 중식(멀티바·샐러드·샌드위치·콤보), 석식(석식 멀티바)\n\n내용이 맞으면 "메뉴 업데이트"를 눌러주세요.`;
  $('uploadBtn').disabled=false;
 }catch(e){$('status').textContent='엑셀 분석 오류: '+e.message;$('uploadBtn').disabled=true}
};
$('uploadBtn').onclick=async()=>{
 if(!parsed.length)return;$('uploadBtn').disabled=true;$('status').textContent='기존 메뉴를 지우고 새 메뉴를 저장하는 중...';
 try{
  const dates=[...new Set(parsed.map(x=>x.menu_date))].sort();
  for(const d of dates){const {error}=await sb.from('menus').delete().eq('menu_date',d);if(error)throw error}
  for(let i=0;i<parsed.length;i+=500){const {error}=await sb.from('menus').insert(parsed.slice(i,i+500));if(error)throw error}
  $('status').textContent=`✅ 업데이트 완료!\n${dates[0]} ~ ${dates[dates.length-1]}\n총 ${parsed.length}개 메뉴가 저장되었습니다.\n\n일반 메뉴 페이지를 새로고침하면 반영됩니다.`;
 }catch(e){$('status').textContent='저장 오류: '+e.message;$('uploadBtn').disabled=false}
};
refresh();
</script></body></html>
