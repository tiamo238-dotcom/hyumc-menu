<script>

const sb=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $=id=>document.getElementById(id);

let parsed=[];


/* 로그인 상태 확인 */

async function refresh(){

  const {data,error}=await sb.auth.getSession();

  if(error){

    $('loginStatus').textContent=error.message;

    return;
  }

  const logged=!!data.session;

  $('loginCard').classList.toggle(
    'hidden',
    logged
  );

  $('uploadCard').classList.toggle(
    'hidden',
    !logged
  );

  $('statsCard').classList.toggle(
    'hidden',
    !logged
  );


  if(logged){

    loadStats(currentStatsRange);

  }

}


sb.auth.onAuthStateChange(
  ()=>{
    refresh();
  }
);


/* 로그인 */

$('loginBtn').onclick=async()=>{

  const email=$('email').value.trim();

  const password=$('password').value;


  if(!email||!password){

    $('loginStatus').textContent=
      '이메일과 비밀번호를 입력하세요.';

    return;
  }


  $('loginBtn').disabled=true;

  $('loginStatus').textContent=

  const {error}=await sb.auth.signInWithPassword({

    password
  });


  $('loginStatus').textContent=
    error
      ? '로그인 실패: '+error.message

  await refresh();

};


/* 로그아웃 */

$('logoutBtn').onclick=async()=>{

  await sb.auth.signOut();

  await refresh();

};


/* 문자열 정리 */

function clean(v){

  return String(v??'')
    .replace(/\r/g,'')
    .trim();

}


/*
  Excel 날짜를 시간대 변환 없이
  YYYY-MM-DD 형태로 변환

  ※ 날짜 하루 밀림 방지를 위한 핵심 부분
*/

function dateKey(v){

  if(v instanceof Date && !isNaN(v)){

    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;

  }


  if(typeof v==='number'){

    const d=XLSX.SSF.parse_date_code(v);

    if(d){

      return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;

    }

  }


  const s=clean(v);

  const m=s.match(
    /(20\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/
  );


  if(m){

    return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;

  }


  return s;

}


/* 공백과 줄바꿈 정리 */

function normalized(v){

  return clean(v)
    .replace(/\s+/g,' ')
    .replace(/\n/g,'');

}


/*
  셀 텍스트 안의 시간 정보 추출
  예: '활기찬\n아침\n(6:50~ 9:00)' → '6:50~9:00'
*/

function extractTime(v){

  const s=clean(v);

  const m=s.match(
    /\(([^)]*\d[^)]*)\)/
  );


  return m
    ? m[1].replace(/\s+/g,'')
    : null;

}


/*
  주말(토/일) 여부 판별

  UTC 기준으로 계산하여
  한국에서 요일이 밀리는 문제를 방지
*/

function isWeekend(k){

  const m=
    String(k).match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if(!m) return false;


  const wd=
    new Date(
      Date.UTC(
        Number(m[1]),
        Number(m[2])-1,
        Number(m[3])
      )
    ).getUTCDay();


  return wd===0 || wd===6;

}


/* 식단 분류 찾기 */

function detectCategory(meal,a,b){

  const aa=normalized(a);

  const bb=normalized(b);


  /* 조식 */

  if(meal==='조식'){

    if(
      (aa.includes('T/O')||aa.includes('take')) &&
      aa.includes('간편식')
    ){

      return 'T/O 간편식';

    }


    /*
      구 형식 호환:
      'take·out(간편식)'이 B열에 오는 경우
    */

    if(
      (bb.includes('T/O')||bb.includes('take')) &&
      bb.includes('간편식')
    ){

      return 'T/O 간편식';

    }


    if(
      bb.includes('PLUS') &&
      bb.includes('코너')
    ){

      return 'PLUS 코너';

    }


    if(
      bb.includes('활기찬') &&
      bb.includes('아침')
    ){

      return '활기찬 아침';

    }


    return null;

  }


  /* 중식 */

  if(meal==='중식'){

    if(
      (aa.includes('T/O')||aa.includes('take')) &&
      aa.includes('샐러드')
    ){

      return 'T/O 샐러드 (예약제)';

    }


    /*
      구 형식 호환:
      'take·out\n샐러드'가 B열에 오는 경우
    */

    if(
      (bb.includes('T/O')||bb.includes('take')) &&
      bb.includes('샐러드')
    ){

      return 'T/O 샐러드 (예약제)';

    }


    if(
      bb.includes('오늘은') &&
      bb.includes('집밥')
    ){

      return '오늘은 집밥';

    }


    if(
      bb.includes('오늘은') &&
      bb.includes('일품')
    ){

      return '오늘은 일품';

    }


    /*
      구 형식 호환:
      9월 이전에는 '오늘은 집밥'/'오늘은 일품' 구분 없이
      '행복한 점심' 하나로만 표기되어 있었음 → '오늘은 집밥'으로 매핑
    */

    if(
      bb.includes('행복한') &&
      bb.includes('점심')
    ){

      return '오늘은 집밥';

    }


    if(bb==='멀티바'){

      return '멀티바';

    }


    /*
      기존 형식의 샐러드/샌드위치/콤보도
      T/O 샐러드로 묶어줌
    */

    if(bb==='샐러드'){

      return 'T/O 샐러드 (예약제)';

    }


    if(bb==='샌드위치'){

      return 'T/O 샐러드 (예약제)';

    }


    if(bb==='콤보'){

      return 'T/O 샐러드 (예약제)';

    }


    return null;

  }


  /* 석식 */

  if(meal==='석식'){

    if(
      bb.includes('건강한') &&
      bb.includes('저녁')
    ){

      return '건강한 저녁';

    }


    if(
      bb.includes('샐러드') &&
      bb.includes('뷔페')
    ){

      return '샐러드 뷔페';

    }


    if(bb==='멀티바'){

      return '멀티바';

    }


    return null;

  }


  return null;

}


/* 조식 / 중식 / 석식 판별 */

function getMealFromRow(a){

  const aa=normalized(a);


  if(aa==='조식') return '조식';

  if(aa==='중식') return '중식';

  if(aa==='석식') return '석식';


  return null;

}


/*
  '원산지' 셀에 적힌 안내문구를
  '*' 기준으로 문장 단위로 분리

  예:
  '* 문장1.        * 문장2. \n(내용)   \n* 문장3.'

  →
  ['문장1.', '문장2. (내용)', '문장3.']
*/

function parseNotice(raw){

  const s=clean(raw);


  return s

    .split('*')

    .map(
      x=>
        x
          .replace(/\s+/g,' ')
          .trim()
    )

    .filter(Boolean);

}


/* 파일 하나 분석 (엑셀 / PDF 자동 구분) */

async function parseFile(file){

  const ext=
    (file.name.split('.').pop()||'')
      .toLowerCase();

  if(ext==='pdf'){

    return parsePdfFile(file);

  }

  return parseExcelFile(file);

}


/* 엑셀 파일 → rows */

async function parseExcelFile(file){

  const buf=await file.arrayBuffer();


  /*
    cellDates:false를 사용하여
    Excel 날짜 숫자를 직접 읽습니다.

    이것도 날짜 하루 밀림 방지를 위한 핵심입니다.
  */

  const wb=XLSX.read(
    buf,
    {
      type:'array',
      cellDates:false
    }
  );


  const ws=
    wb.Sheets[wb.SheetNames[0]];


  const rows=
    XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:null,
        raw:true
      }
    );


  return parseRows(rows,file.name);

}


/*
  ===== PDF 식단표 분석 =====

  본푸드 주간 메뉴표 PDF(벡터 PDF)를 읽어서
  기존 엑셀을 읽은 결과(rows 배열)와 같은 모양으로 바꿔줍니다.
  → 이후에는 엑셀과 똑같은 parseRows()가 그대로 처리합니다.

  동작 방식
  1) pdf.js로 글자(위치 포함)를 추출
  2) 페이지를 그림으로 그려서 표의 가로선 위치를 찾음
     (오늘은 집밥/오늘은 일품이 하나로 합쳐진 날을
      구분하기 위해 필요합니다)
  3) 왼쪽 분류칸(조식/활기찬 아침/...)과 날짜별 칸을
     선 위치 기준으로 맞춰서 엑셀과 같은 행/열로 재구성
*/

const PDFJS_BASE=
  window.PDFJS_BASE||
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';

const PDF_SCALE=3;

const PDF_MEAL_WORDS=['조식','중식','석식'];

let pdfjsPromise=null;


/* pdf.js 불러오기 (PDF를 올렸을 때만 불러옴) */

function loadPdfJs(){

  if(!pdfjsPromise){

    pdfjsPromise=
      import(PDFJS_BASE+'pdf.min.mjs')
        .then(lib=>{

          lib.GlobalWorkerOptions.workerSrc=
            PDFJS_BASE+'pdf.worker.min.mjs';

          return lib;

        })
        .catch(()=>{

          pdfjsPromise=null;

          throw new Error(
            'PDF 분석 도구를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.'
          );

        });

  }

  return pdfjsPromise;

}


/*
  그림(ImageData)에서 가로선 위치 찾기

  xa~xb(pt) 구간에서 거의 전체가 어두운 가로줄을 찾아
  y 위치(pt) 목록으로 돌려줍니다.
  글자 줄은 일부만 어둡기 때문에 걸러집니다.
*/

function findHBorders(img,xa,xb,ya,yb){

  const S=PDF_SCALE;

  const W=img.width;

  const H=img.height;

  const d=img.data;

  const x0=Math.max(0,Math.round(xa*S));

  const x1=Math.min(W,Math.round(xb*S));

  const y0=Math.max(0,Math.floor(ya*S));

  const y1=Math.min(H-1,Math.ceil(yb*S));


  if(x1-x0<4) return [];


  const found=[];

  let run=[];


  const flush=()=>{

    if(!run.length) return;

    found.push(
      (run[0]+run[run.length-1]+1)/2/S
    );

    run=[];

  };


  for(let y=y0;y<=y1;y++){

    let dark=0;

    for(let x=x0;x<x1;x++){

      const i=(y*W+x)*4;

      const lum=
        0.299*d[i]+
        0.587*d[i+1]+
        0.114*d[i+2];

      if(lum<215) dark++;

    }

    if(dark/(x1-x0)>=0.9){

      run.push(y);

    }
    else{

      flush();

    }

  }

  flush();


  /* 1.5pt 이내로 붙은 선은 하나로 */

  const out=[];

  for(const y of found){

    if(
      !out.length ||
      y-out[out.length-1]>1.5
    ){

      out.push(y);

    }

  }

  return out;

}


/* 값 이하 중 가장 큰 선 위치 */

function lastAtOrBefore(list,y,fallback){

  let r=fallback;

  for(const v of list){

    if(v<=y+0.001) r=v;

    else break;

  }

  return r;

}


/*
  PDF 머리글의 월/일/요일로 연도 추정

  PDF에는 연도가 없어서 파일명(예: 본푸드메뉴_26_11_02)의
  연도를 우선 사용하고, 없으면 오늘 날짜에 가장 가까운
  연도 중 요일이 맞는 것을 고릅니다.
*/

function inferPdfDates(heads,fileName){

  const WD='일월화수목금토';

  const build=y0=>{

    let y=y0;

    let prevMonth=heads[0].m;

    return heads.map(h=>{

      if(h.m<prevMonth) y++;

      prevMonth=h.m;

      return {y,m:h.m,d:h.d,wd:h.wd};

    });

  };

  const ok=list=>
    list.every(x=>
      WD[
        new Date(
          Date.UTC(x.y,x.m-1,x.d)
        ).getUTCDay()
      ]===x.wd
    );


  const candidates=[];

  const fm=
    String(fileName||'').match(
      /(\d{2,4})[._\-](\d{1,2})[._\-](\d{1,2})/
    );

  if(fm){

    let y=Number(fm[1]);

    if(y<100) y+=2000;

    candidates.push(y);

  }

  const nowY=new Date().getFullYear();

  [nowY,nowY+1,nowY-1].forEach(y=>{

    if(!candidates.includes(y)) candidates.push(y);

  });


  for(const y of candidates){

    const list=build(y);

    if(ok(list)){

      return list.map(x=>
        `${x.y}-${String(x.m).padStart(2,'0')}-${String(x.d).padStart(2,'0')}`
      );

    }

  }


  throw new Error(
    'PDF의 날짜(요일)와 맞는 연도를 찾지 못했습니다. 파일명에 날짜를 넣어주세요. (예: 본푸드메뉴_26_11_02.pdf)'
  );

}


/*
  PDF 한 페이지 → 엑셀 모양 rows

  rows[1] : 날짜 헤더 (2번째 열부터)
  rows[n] : [meal칸, 분류칸, 날짜1 메뉴, 날짜2 메뉴, ...]

  메뉴표가 아닌 페이지면 null
*/

async function pdfPageToRows(page,fileName){

  const S=PDF_SCALE;

  const vp1=page.getViewport({scale:1});

  const vp=page.getViewport({scale:S});


  /* ---------- 1. 글자 추출 ---------- */

  const tc=await page.getTextContent();

  const items=[];

  for(const it of tc.items){

    const str=String(it.str||'').trim();

    if(!str) continue;

    const [vx,vy]=
      vp1.convertToViewportPoint(
        it.transform[4],
        it.transform[5]
      );

    const h=Math.abs(it.height)||9;

    const w=Math.abs(it.width)||0;

    items.push({

      str,

      xc:vx+w/2,

      yc:vy-h*0.3

    });

  }


  /* ---------- 2. 날짜 머리글 ---------- */

  const re=
    /(\d{1,2})\s*\/\s*(\d{1,2})\s*\(\s*([일월화수목금토])\s*\)/;

  let heads=
    items
      .filter(i=>re.test(i.str))
      .map(i=>{

        const m=i.str.match(re);

        return {
          m:Number(m[1]),
          d:Number(m[2]),
          wd:m[3],
          xc:i.xc,
          yc:i.yc
        };

      });


  if(!heads.length) return null;


  const headY=
    Math.min(...heads.map(h=>h.yc));

  heads=
    heads
      .filter(h=>Math.abs(h.yc-headY)<4)
      .sort((a,b)=>a.xc-b.xc);


  const dateKeys=
    inferPdfDates(heads,fileName);


  let colW=97.4;

  if(heads.length>1){

    const diffs=[];

    for(let i=1;i<heads.length;i++){

      diffs.push(heads[i].xc-heads[i-1].xc);

    }

    diffs.sort((a,b)=>a-b);

    colW=diffs[Math.floor(diffs.length/2)];

  }


  const colLeft=
    heads.map(h=>h.xc-colW/2);

  const colRight=
    heads.map(h=>h.xc+colW/2);

  const labelRight=colLeft[0];

  /* 분류칸을 '구분(조식/중식/석식)칸'과 '세부분류칸'으로 나누는 x */

  const split=labelRight-0.3*colW;


  const colOf=xc=>{

    for(let k=0;k<heads.length;k++){

      if(xc>=colLeft[k] && xc<colRight[k]) return k;

    }

    return -1;

  };


  /* ---------- 3. 표의 가로선 찾기 ---------- */

  const canvas=document.createElement('canvas');

  canvas.width=Math.ceil(vp.width);

  canvas.height=Math.ceil(vp.height);

  const ctx=
    canvas.getContext(
      '2d',
      {willReadFrequently:true}
    );

  ctx.fillStyle='#fff';

  ctx.fillRect(0,0,canvas.width,canvas.height);

  await page.render({
    canvasContext:ctx,
    viewport:vp
  }).promise;

  const img=
    ctx.getImageData(
      0,0,canvas.width,canvas.height
    );


  const pageH=vp1.height;


  /* 세부분류칸(활기찬 아침/오늘은 집밥 ...)의 가로선 */

  const subBorders=
    findHBorders(
      img,
      labelRight-0.28*colW+1.5,
      labelRight-1.5,
      headY,
      pageH
    ).filter(y=>y>headY+1);

  if(subBorders.length<3) return null;

  const bodyTop=subBorders[0];


  /* 구분칸(조식/중식/석식)의 가로선 */

  const mealBorders=
    findHBorders(
      img,
      labelRight-0.6*colW+2,
      labelRight-0.3*colW-2,
      headY,
      pageH
    );


  /* ---------- 4. 왼쪽 분류칸 ---------- */

  const labelItems=
    items.filter(i=>i.xc<labelRight);

  const norm=s=>
    String(s).replace(/\s+/g,'');


  /* '원산지' 칸 위치 → 메뉴 영역의 끝 */

  let footerTop=null;

  for(const it of labelItems){

    if(norm(it.str).startsWith('원산지')){

      footerTop=
        lastAtOrBefore(
          subBorders,
          it.yc,
          it.yc
        );

      break;

    }

  }

  if(footerTop===null){

    footerTop=subBorders[subBorders.length-1];

  }


  const sections=[];

  for(let i=0;i<subBorders.length-1;i++){

    const top=subBorders[i];

    const bottom=subBorders[i+1];

    if(top>=footerTop-0.5) break;

    sections.push({top,bottom});

  }


  /* 조식/중식/석식 글자와 그 칸의 시작 위치 */

  const mealCells=[];

  for(const it of labelItems){

    if(
      it.xc<split &&
      PDF_MEAL_WORDS.includes(it.str)
    ){

      mealCells.push({

        name:it.str,

        top:lastAtOrBefore(
          mealBorders,
          it.yc,
          bodyTop
        )

      });

    }

  }

  mealCells.sort((a,b)=>a.top-b.top);


  let prevMeal=null;

  for(const sec of sections){

    const lab=
      labelItems
        .filter(
          i=>i.yc>=sec.top && i.yc<sec.bottom
        )
        .sort(
          (p,q)=>p.yc-q.yc||p.xc-q.xc
        );

    const aText=
      lab
        .filter(
          i=>
            i.xc<split &&
            !PDF_MEAL_WORDS.includes(i.str)
        )
        .map(i=>i.str)
        .join('\n');

    const bText=
      lab
        .filter(i=>i.xc>=split)
        .map(i=>i.str)
        .join('\n');


    let meal=null;

    for(const mc of mealCells){

      if(mc.top<=sec.top+0.8) meal=mc.name;

    }


    sec.meal=meal;

    sec.hasLabel=
      !!(aText.trim()||bText.trim());


    if(meal && meal!==prevMeal){

      /* 이 구분의 첫 분류 → 엑셀처럼 첫 칸에 '조식' 등 표시 */

      sec.a=meal;

      sec.b=
        [aText,bText]
          .filter(Boolean)
          .join('\n');

      prevMeal=meal;

    }
    else{

      sec.a=aText;

      sec.b=bText;

    }

    sec.cols=heads.map(()=>[]);

  }


  /* ---------- 5. 날짜별 칸 → 분류에 배정 ---------- */

  const colBorders=
    heads.map((h,k)=>
      findHBorders(
        img,
        colLeft[k]+1.5,
        colRight[k]-1.5,
        bodyTop-2,
        footerTop+2
      )
    );


  const body=
    items.filter(
      i=>
        i.xc>=labelRight &&
        i.yc>=bodyTop &&
        i.yc<footerTop
    );


  for(const it of body){

    const k=colOf(it.xc);

    if(k<0) continue;

    /* 이 글자가 들어있는 칸(셀)의 윗선 */

    const cellTop=
      lastAtOrBefore(
        colBorders[k],
        it.yc,
        bodyTop
      );

    const sec=
      sections.find(
        s=>
          s.top<=cellTop+0.8 &&
          cellTop+0.8<s.bottom
      );

    if(!sec || !sec.hasLabel || !sec.meal) continue;

    sec.cols[k].push(it);

  }


  /* ---------- 6. 칸 안의 글자를 줄 단위 메뉴로 ---------- */

  const toLines=list=>{

    const sorted=
      [...list].sort(
        (p,q)=>p.yc-q.yc||p.xc-q.xc
      );

    const lines=[];

    let lastY=null;

    for(const it of sorted){

      if(
        lastY!==null &&
        Math.abs(it.yc-lastY)<=2
      ){

        lines[lines.length-1]+=' '+it.str;

      }
      else if(
        it.str.startsWith('&') &&
        lines.length
      ){

        /* '계란볶음밥' 아래줄의 '&자장소스' → 앞줄에 붙임 */

        lines[lines.length-1]+=it.str;

        lastY=it.yc;

        continue;

      }
      else{

        lines.push(it.str);

      }

      lastY=it.yc;

    }

    return lines;

  };


  const rows=[
    [''],
    [null,null,...dateKeys]
  ];


  for(const sec of sections){

    if(!sec.hasLabel || !sec.meal) continue;

    const colLines=
      sec.cols.map(toLines);

    const n=
      Math.max(
        ...colLines.map(l=>l.length),
        0
      );

    if(!n) continue;

    for(let i=0;i<n;i++){

      rows.push([

        i===0?sec.a:'',

        i===0?sec.b:'',

        ...colLines.map(l=>l[i]??'')

      ]);

    }

  }


  /* ---------- 7. 원산지/알레르기 안내문구 ---------- */

  const footer=
    items
      .filter(
        i=>
          i.xc>=labelRight &&
          i.yc>=footerTop
      )
      .sort((a,b)=>{

        return Math.abs(a.yc-b.yc)<=2
          ?a.xc-b.xc
          :a.yc-b.yc;

      })
      .map(i=>i.str)
      .join(' ');

  /* 맨 위의 'Take-Out 운영시간' 안내줄은 건너뛰고 '*' 부터 사용 */

  const star=footer.indexOf('*');

  if(star>=0){

    rows.push([

      '원산지',

      null,

      footer.slice(star)

    ]);

  }


  return rows;

}


/* PDF 파일 → 메뉴 목록 (페이지마다 분석) */

async function parsePdfFile(file){

  const pdfjs=await loadPdfJs();

  const buf=await file.arrayBuffer();

  const doc=
    await pdfjs.getDocument({
      data:new Uint8Array(buf)
    }).promise;


  let result=[];

  let pages=0;


  for(let p=1;p<=doc.numPages;p++){

    const page=await doc.getPage(p);

    const rows=
      await pdfPageToRows(
        page,
        file.name
      );

    if(!rows) continue;

    pages++;

    result=
      result.concat(
        parseRows(
          rows,
          `${file.name} (${p}쪽)`
        )
      );

  }


  if(!pages){

    throw new Error(
      `${file.name}: 식단표를 찾지 못했습니다. 본푸드 주간 메뉴표 PDF가 맞는지 확인해주세요.`
    );

  }


  return result;

}


/*
  rows(엑셀 모양의 2차원 배열) → 메뉴 목록

  엑셀과 PDF 모두 이 함수를 거칩니다.
*/

function parseRows(rows,fileName){

  if(rows.length<3){

    throw new Error(
      `${fileName}: 파일 내용이 너무 적습니다.`
    );

  }


  const header=rows[1]||[];

  const dateCols=[];


  for(
    let c=0;
    c<header.length;
    c++
  ){

    const k=dateKey(header[c]);


    if(
      /^\d{4}-\d{2}-\d{2}$/.test(k)
    ){

      dateCols.push([c,k]);

    }

  }


  if(!dateCols.length){

    throw new Error(
      `${fileName}: 2번째 행에서 날짜를 찾지 못했습니다.`
    );

  }


  const result=[];


  let meal=null;

  let sub=null;

  let subTime=null;

  let order=0;

  let noticeLines=[];


  /*
    주말/공휴일 자동 인식

    엑셀 형식상, 중식이 단일메뉴로 운영되는 날은
    '오늘은 집밥'의 첫 줄(밥 칸)이 비어있고
    그 아래부터 '오늘은 일품' 영역까지 이어서
    하나의 메뉴가 적혀 있습니다.

    그래서 요일(토/일) 대신, '오늘은 집밥' 첫 줄이
    비어있는 날짜를 사전 스캔해서 자동으로 찾습니다.
    (주말이든 공휴일이든, 엑셀이 이 형식을 따르면
    자동으로 인식됩니다)
  */

  const singleMenuDates=new Set();

  {

    let scanMeal=null;

    let scanSub=null;

    let lunchFirstRow=null;


    for(
      let r=2;
      r<rows.length;
      r++
    ){

      const a=clean(rows[r]?.[0]);

      const b=clean(rows[r]?.[1]);


      if(
        normalized(a)==='원산지' ||
        normalized(a)==='원 산 지' ||
        normalized(b)==='원산지' ||
        normalized(b)==='원 산 지'
      ){

        break;

      }


      const dm=
        getMealFromRow(a);


      if(dm){

        scanMeal=dm;

        scanSub=null;

      }


      const ds=
        detectCategory(
          scanMeal,a,b
        );


      if(ds){

        scanSub=ds;


        if(
          scanMeal==='중식' &&
          scanSub==='오늘은 집밥' &&
          lunchFirstRow===null
        ){

          lunchFirstRow=r;

          break;

        }

      }

    }


    if(lunchFirstRow!==null){

      for(
        const [col,k]
        of dateCols
      ){

        const v=
          clean(
            rows[lunchFirstRow]?.[col]
          );


        if(!v){

          singleMenuDates.add(k);

        }

      }

    }

  }


  for(
    let r=2;
    r<rows.length;
    r++
  ){

    const a=clean(rows[r]?.[0]);

    const b=clean(rows[r]?.[1]);


    /*
      원산지부터는 메뉴가 아니므로 종료

      이 행의 날짜 칸에 적힌 안내문구를
      최하단 공지사항으로 사용
    */

    if(
      normalized(a)==='원산지' ||
      normalized(a)==='원 산 지' ||
      normalized(b)==='원산지' ||
      normalized(b)==='원 산 지'
    ){

      for(
        const [col]
        of dateCols
      ){

        const raw=
          rows[r]?.[col];


        if(clean(raw)){

          noticeLines=
            parseNotice(raw);

          break;

        }

      }


      break;

    }


    const detectedMeal=
      getMealFromRow(a);


    if(detectedMeal){

      meal=detectedMeal;

      sub=null;

      order=0;

    }


    const detectedSub=
      detectCategory(
        meal,
        a,
        b
      );


    if(detectedSub){

      sub=detectedSub;

      subTime=
        extractTime(a)||
        extractTime(b);

    }


    if(!meal || !sub){

      continue;

    }


    for(
      const [col,k]
      of dateCols
    ){

      const value=
        clean(rows[r]?.[col]);


      if(
        !value ||
        value==='**' ||
        value.includes('미운영')
      ){

        continue;

      }


      /*
        중식이 단일메뉴로 운영되는 날(주말/공휴일 등)은
        '오늘은 집밥' / '오늘은 일품' 구분 없이
        하나의 분류로 합쳐서 저장

        (요일이 아니라 엑셀의 빈칸 형식으로 자동 판별됨)
      */

      let finalSub=sub;


      if(
        meal==='중식' &&
        singleMenuDates.has(k) &&
        (
          sub==='오늘은 집밥' ||
          sub==='오늘은 일품'
        )
      ){

        finalSub='오늘은 집밥';

      }


      result.push({

        menu_date:k,

        meal_type:meal,

        sub_type:finalSub,

        sub_time:subTime,

        menu_name:value,

        sort_order:order++

      });

    }

  }


  if(!result.length){

    throw new Error(
      `${fileName}: 메뉴를 찾지 못했습니다. 파일 형식을 확인해주세요.`
    );

  }


  /*
    이 파일에 포함된 모든 날짜에
    동일한 공지사항(원산지 안내문구)을 저장
  */

  if(noticeLines.length){

    const noticeText=
      noticeLines.join('\n');


    for(
      const [,k]
      of dateCols
    ){

      result.push({

        menu_date:k,

        meal_type:'공지',

        sub_type:'원산지',

        sub_time:null,

        menu_name:noticeText,

        sort_order:0

      });

    }

  }


  return result;

}


/* 중복 메뉴 제거 */

function uniqueMenus(items){

  const seen=new Set();

  const out=[];


  for(const x of items){

    const key=[
      x.menu_date,
      x.meal_type,
      x.sub_type,
      x.menu_name,
      x.sort_order
    ].join('|');


    if(seen.has(key)){

      continue;

    }


    seen.add(key);

    out.push(x);

  }


  return out;

}

      <br>

      🥪 T/O 간편식:
      ${counts['T/O 간편식']||0}개

      <br><br>

      🍚 오늘은 집밥:
      ${counts['오늘은 집밥']||0}개

      <br>

      🍜 오늘은 일품:
      ${counts['오늘은 일품']||0}개

      <br>

      🌿 멀티바:
      ${counts['멀티바']||0}개

      <br>

      🥗 T/O 샐러드 (예약제):
      ${counts['T/O 샐러드 (예약제)']||0}개

      <br><br>

      🌙 건강한 저녁:
      ${counts['건강한 저녁']||0}개

      <br>

      🥗 샐러드 뷔페:
      ${counts['샐러드 뷔페']||0}개

    </div>

    <br>

    내용이 맞으면
    "메뉴 업데이트"를 눌러주세요.

/* 미리보기 (엑셀 / PDF) */

$('previewBtn').onclick=async()=>{

  const files=[
    $('file1').files[0],
    $('file2').files[0]
  ].filter(Boolean);


  if(!files.length){

    $('status').textContent=
      '1주차 또는 2주차 파일을 선택하세요.';

    return;

  }


  $('previewBtn').disabled=true;

  $('uploadBtn').disabled=true;

  $('status').textContent=
    '파일을 분석하는 중입니다... (PDF는 몇 초 걸릴 수 있어요)';


  try{

    const results=[];


    for(
      const file of files
    ){

      results.push(
        await parseFile(file)
      );

    }


    parsed=
      uniqueMenus(
        results.flat()
      ).sort(
        (a,b)=>
          a.menu_date.localeCompare(b.menu_date) ||
          a.meal_type.localeCompare(b.meal_type) ||
          a.sort_order-b.sort_order
      );


    renderPreview();


    $('uploadBtn').disabled=false;

  }
  catch(e){

    parsed=[];

    $('preview').classList.add(
      'hidden'
    );

    $('status').textContent=
      '파일 분석 오류: '+e.message;

  }
  finally{

    $('previewBtn').disabled=false;

  }

};


/* 메뉴 업데이트 */

$('uploadBtn').onclick=async()=>{

  if(!parsed.length) return;


  $('uploadBtn').disabled=true;


  $('status').textContent=
    '기존 메뉴를 지우고 새 메뉴를 저장하는 중...';


  try{

    const dates=[
      ...new Set(
        parsed.map(x=>x.menu_date)
      )
    ].sort();


    /*
      기존 메뉴 전체 삭제

      (겹치는 날짜만 지우면 예전에 올렸던
      다른 주차 데이터가 계속 남아있게 되어,
      과거 식단이 사라지지 않는 문제와
      테이블이 계속 커지는 문제가 함께 생깁니다.

      이번에 올린 1주차+2주차 식단이
      항상 전체 식단표가 되도록
      기존 데이터를 전부 지우고 새로 저장합니다.)
    */

    const {error:delError,count:deletedCount}=
      await sb
        .from('menus')
        .delete({count:'exact'})
        .neq('id',0);


    if(delError) throw delError;


    /*
      500개 단위로 저장
    */

    for(
      let i=0;
      i<parsed.length;
      i+=500
    ){

      const {error}=
        await sb
          .from('menus')
          .insert(
            parsed.slice(i,i+500)
          );


      if(error) throw error;

    }


    $('status').innerHTML=`

      ✅ <strong>업데이트 완료!</strong>

      <br>

      ${dates[0]} ~ ${dates[dates.length-1]}

      <br>

      기존 메뉴 ${deletedCount ?? 0}개 삭제 →
      새 메뉴 ${parsed.length}개 저장

      <br><br>

      일반 메뉴 페이지를 새로고침하면
      반영됩니다.

    `;

  }
  catch(e){

    $('status').textContent=
      '저장 오류: '+e.message;

    $('uploadBtn').disabled=false;

  }

};


/*
  ===== 접속자 통계 ===== 
*/

let currentStatsRange='daily';


/*
  집계는 DB(page_view_counts 함수) 안에서 처리합니다.

  데이터가 아무리 많이 쌓여도(수십만 건 이상)
  항상 "구간별 개수"만 받아오기 때문에
  느려지지 않습니다.

  bucket: 'day' | 'week' | 'month'
  반환값: { 'YYYY-MM-DD' 또는 'YYYY-MM' : 개수 } 형태의 맵
*/

async function fetchBucketCounts(bucket,since){

  const {data,error}=
    await sb.rpc(
      'page_view_counts',
      {bucket,since}
    );


  if(error) throw error;


  const map={};


  (data||[]).forEach(row=>{

    const key=
      bucket==='month'
        ?String(row.bucket_start).slice(0,7)
        :String(row.bucket_start).slice(0,10);


    map[key]=Number(row.cnt);

  });


  return map;

}


/*
  UTC 타임스탬프를 한국시간(KST) 기준
  YYYY-MM-DD 문자열로 변환

  (브라우저 시간대에 관계없이
  항상 같은 결과가 나오도록 직접 계산)
*/

function toKstDateKey(isoString){

  const utcMs=
    new Date(isoString).getTime();

  const kst=
    new Date(utcMs+9*60*60*1000);


  const y=kst.getUTCFullYear();

  const m=
    String(
      kst.getUTCMonth()+1
    ).padStart(2,'0');

  const d=
    String(
      kst.getUTCDate()
    ).padStart(2,'0');


  return `${y}-${m}-${d}`;

}


/*
  해당 날짜가 속한 주(월~일)의
  월요일 날짜(YYYY-MM-DD)를 계산
*/

function mondayKeyOf(dateKey){

  const [y,m,d]=
    dateKey.split('-').map(Number);

  const dt=
    new Date(
      Date.UTC(y,m-1,d)
    );

  const day=dt.getUTCDay();

  const diff=
    day===0
      ?-6
      :1-day;


  dt.setUTCDate(
    dt.getUTCDate()+diff
  );


  const yy=dt.getUTCFullYear();

  const mm=
    String(
      dt.getUTCMonth()+1
    ).padStart(2,'0');

  const dd=
    String(
      dt.getUTCDate()
    ).padStart(2,'0');


  return `${yy}-${mm}-${dd}`;

}


/*
  YYYY-MM-DD → M/D(요일) 표시용 문자열
*/

function shortLabel(dateKey){

  const [y,m,d]=
    dateKey.split('-').map(Number);

  const wd=
    ['일','월','화','수','목','금','토'][
      new Date(
        Date.UTC(y,m-1,d)
      ).getUTCDay()
    ];


  return `${m}/${d}(${wd})`;

}


/*
  선택한 기간(daily/weekly/monthly)에 맞춰
  Supabase에서 접속 기록을 불러와 집계
*/

async function loadStats(range){

  currentStatsRange=range;


  document
    .querySelectorAll('.stats-tab')
    .forEach(btn=>{

      btn.classList.toggle(
        'active',
        btn.dataset.range===range
      );

    });


  $('statsChart').innerHTML=
    '<div class="stats-empty">불러오는 중...</div>';


  /*
    기간별로 필요한 만큼만 조회
    (전체를 다 불러오지 않도록)
  */

  const daysBack=
    range==='daily'
      ?30
      :range==='weekly'
        ?84  // 약 12주
        :365; // 약 12개월


  const since=
    new Date(
      Date.now()-daysBack*86400000
    ).toISOString();


  const bucket=
    range==='daily'
      ?'day'
      :range==='weekly'
        ?'week'
        :'month';


  let counts;


  try{

    counts=
      await fetchBucketCounts(
        bucket,
        since
      );

  }
  catch(error){

    $('statsChart').innerHTML=
      `<div class="stats-empty">
        통계를 불러오지 못했습니다.
        <br>
        ${error.message}
      </div>`;

    $('statsSummary').textContent='';

    return;

  }


  /*
    화면에 표시할 구간 목록 생성
    (데이터가 없는 날짜/주/달도 0으로 표시)
  */

  const items=[];


  if(range==='daily'){

    for(
      let i=daysBack-1;
      i>=0;
      i--
    ){

      const d=
        new Date(
          Date.now()-i*86400000
        );

      const key=
        toKstDateKey(d.toISOString());


      items.push({

        key,

        label:shortLabel(key),

        count:counts[key]||0

      });

    }

  }
  else if(range==='weekly'){

    const todayKey=
      toKstDateKey(
        new Date().toISOString()
      );

    const thisMonday=
      mondayKeyOf(todayKey);


    const weeks=[];

    let cursor=thisMonday;


    for(
      let i=0;
      i<12;
      i++
    ){

      weeks.unshift(cursor);


      const [y,m,d]=
        cursor.split('-').map(Number);

      const dt=
        new Date(
          Date.UTC(y,m-1,d)
        );

      dt.setUTCDate(
        dt.getUTCDate()-7
      );


      cursor=
        `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;

    }


    weeks.forEach(mon=>{

      const [y,m,d]=
        mon.split('-').map(Number);

      const sun=
        new Date(
          Date.UTC(y,m-1,d)
        );

      sun.setUTCDate(
        sun.getUTCDate()+6
      );


      const label=
        `${m}/${d}~${sun.getUTCMonth()+1}/${sun.getUTCDate()}`;


      items.push({

        key:mon,

        label,

        count:counts[mon]||0

      });

    });

  }
  else{

    const now=new Date();

    const cursor=
      new Date(
        Date.UTC(
          now.getUTCFullYear(),
          now.getUTCMonth(),
          1
        )
      );


    const monthsList=[];


    for(
      let i=0;
      i<12;
      i++
    ){

      const y=cursor.getUTCFullYear();

      const m=
        String(
          cursor.getUTCMonth()+1
        ).padStart(2,'0');


      monthsList.unshift(`${y}-${m}`);


      cursor.setUTCMonth(
        cursor.getUTCMonth()-1
      );

    }


    monthsList.forEach(key=>{

      const [y,m]=
        key.split('-');


      items.push({

        key,

        label:`${y}.${m}`,

        count:counts[key]||0

      });

    });

  }


  const total=
    items.reduce(
      (sum,x)=>sum+x.count,
      0
    );


  const rangeLabel=
    range==='daily'
      ?'최근 30일'
      :range==='weekly'
        ?'최근 12주'
        :'최근 12개월';


  $('statsSummary').innerHTML=

    `${rangeLabel} 총 접속
    <strong>${total}</strong>회`;


  renderStatsChart(items);

}


/*
  막대그래프 렌더링 (순수 HTML/CSS, 외부 차트 라이브러리 없음)
*/

function renderStatsChart(items){

  if(!items.length){

    $('statsChart').innerHTML=
      '<div class="stats-empty">데이터가 없습니다.</div>';

    return;

  }


  const max=
    Math.max(
      ...items.map(x=>x.count),
      1
    );


  const bars=
    items.map(x=>{

      const h=
        Math.max(
          Math.round(
            (x.count/max)*140
          ),
          x.count>0?4:0
        );


      return `
        <div class="stats-bar-col">
          <div class="stats-bar-count">${x.count}</div>
          <div class="stats-bar" style="height:${h}px" title="${x.label}: ${x.count}회"></div>
          <div class="stats-bar-label">${x.label}</div>
        </div>
      `;

    }).join('');


  $('statsChart').innerHTML=
    `<div class="stats-bars">${bars}</div>`;

}


/*
  탭 클릭
*/

document
  .querySelectorAll('.stats-tab')
  .forEach(btn=>{

    btn.onclick=
      ()=>{

        loadStats(
          btn.dataset.range
        );

      };

  });


refresh();

</script>
