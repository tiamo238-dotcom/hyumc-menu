<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>식단 관리자</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="admin-wrap">

<section class="hero">
  <div class="logo">👩‍🍳</div>
  <div class="title">식단 관리자</div>
  <div class="subtitle">엑셀파일을 올리면 메뉴가 업데이트됩니다.</div>
</section>

<!-- 로그인 -->
<section id="loginCard" class="admin-card">

  <h2>🔐 관리자 로그인</h2>

  <p class="small">
    관리자 계정으로 로그인해야 메뉴를 수정할 수 있습니다.
  </p>

  <input
    id="email"
    type="email"
    placeholder="관리자 이메일"
    style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:10px"
  >

  <input
    id="password"
    type="password"
    placeholder="비밀번호"
    style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:8px"
  >

  <button class="action" id="loginBtn">로그인</button>

  <div id="loginStatus" class="status"></div>

</section>


<!-- 업로드 -->
<section id="uploadCard" class="admin-card hidden">

  <h2>📁 새 식단 업로드</h2>

  <p class="small">
    1주차와 2주차의 주간 메뉴 엑셀파일을 각각 선택하세요.
  </p>


  <!-- 1주차 -->
  <div style="
    margin-top:15px;
    padding:14px;
    border:1px solid #eadfd8;
    border-radius:15px;
    background:#fffaf7;
  ">

    <h3 style="margin:0 0 10px 0;">📅 1주차 식단</h3>

    <input
      id="file1"
      type="file"
      accept=".xlsx,.xls"
    >

  </div>


  <!-- 2주차 -->
  <div style="
    margin-top:12px;
    padding:14px;
    border:1px solid #eadfd8;
    border-radius:15px;
    background:#fffaf7;
  ">

    <h3 style="margin:0 0 10px 0;">📅 2주차 식단</h3>

    <input
      id="file2"
      type="file"
      accept=".xlsx,.xls"
    >

  </div>


  <button
    class="action secondary"
    id="previewBtn"
    style="margin-top:15px;"
  >
    1. 엑셀 미리보기
  </button>


  <div id="preview" class="preview hidden"></div>


  <button
    class="action"
    id="uploadBtn"
    disabled
  >
    2. 메뉴 업데이트
  </button>


  <div id="status" class="status"></div>


  <button
    class="action secondary"
    id="logoutBtn"
  >
    로그아웃
  </button>

</section>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- XLSX -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- 설정 -->
<script src="js/config.js"></script>


<script>

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $ = id => document.getElementById(id);

let parsed = [];


/* =========================================================
   로그인 상태 확인
========================================================= */

async function refresh(){

  const {data,error} = await sb.auth.getSession();

  if(error){

    $('loginStatus').textContent = error.message;

    return;
  }

  const logged = !!data.session;

  $('loginCard').classList.toggle(
    'hidden',
    logged
  );

  $('uploadCard').classList.toggle(
    'hidden',
    !logged
  );
}


sb.auth.onAuthStateChange(() => {

  refresh();

});


/* =========================================================
   로그인
========================================================= */

$('loginBtn').onclick = async () => {

  const email =
    $('email').value.trim();

  const password =
    $('password').value;


  if(!email || !password){

    $('loginStatus').textContent =
      '이메일과 비밀번호를 입력하세요.';

    return;
  }


  $('loginBtn').disabled = true;

  $('loginStatus').textContent =
    '로그인 중...';


  const {error} =
    await sb.auth.signInWithPassword({
      email,
      password
    });


  $('loginStatus').textContent =
    error
      ? '로그인 실패: ' + error.message
      : '로그인 성공!';


  $('loginBtn').disabled = false;

  await refresh();

};


/* =========================================================
   로그아웃
========================================================= */

$('logoutBtn').onclick = async () => {

  await sb.auth.signOut();

  await refresh();

};


/* =========================================================
   문자열 정리
========================================================= */

function clean(v){

  if(v === null || v === undefined){

    return '';

  }

  return String(v)
    .replace(/\r/g,'')
    .trim();

}


/* =========================================================
   비교용 문자열
   줄바꿈 / 공백 제거
========================================================= */

function compact(v){

  return clean(v)
    .replace(/\s+/g,'')
    .replace(/·/g,'/')
    .toLowerCase();

}


/* =========================================================
   날짜 변환
========================================================= */

function dateKey(v){

  if(v === null || v === undefined || v === ''){

    return '';

  }


  /* Date 객체 */

  if(v instanceof Date && !isNaN(v.getTime())){

    return [
      v.getFullYear(),
      String(v.getMonth()+1).padStart(2,'0'),
      String(v.getDate()).padStart(2,'0')
    ].join('-');

  }


  /* Excel 숫자 날짜 */

  if(typeof v === 'number'){

    try{

      const d =
        XLSX.SSF.parse_date_code(v);

      if(d){

        return [
          d.y,
          String(d.m).padStart(2,'0'),
          String(d.d).padStart(2,'0')
        ].join('-');

      }

    }catch(e){

      return '';

    }

  }


  const s = clean(v);


  /* yyyy-mm-dd */

  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){

    const p = s.split('-');

    return [
      p[0],
      String(p[1]).padStart(2,'0'),
      String(p[2]).padStart(2,'0')
    ].join('-');

  }


  return s;

}


/* =========================================================
   분류 판별
========================================================= */

function detectCategory(meal, a, b){

  const A = compact(a);
  const B = compact(b);


  /* -------------------------
     조식
  ------------------------- */

  if(meal === '조식'){

    if(
      B.includes('활기찬아침')
    ){

      return '활기찬아침';

    }


    if(
      B.includes('plus코너')
    ){

      return 'PLUS코너';

    }


    if(
      A.includes('t/o간편식') ||
      A.includes('to간편식')
    ){

      return 'T/O간편식';

    }

  }


  /* -------------------------
     중식
  ------------------------- */

  if(meal === '중식'){

    if(
      B.includes('오늘은집밥')
    ){

      return '오늘은집밥';

    }


    if(
      B.includes('오늘은일품')
    ){

      return '오늘은일품';

    }


    if(
      B.includes('멀티바')
    ){

      return '멀티바';

    }


    if(
      A.includes('t/o샐러드') ||
      A.includes('to샐러드')
    ){

      return 'T/O샐러드(예약제)';

    }

  }


  /* -------------------------
     석식
  ------------------------- */

  if(meal === '석식'){

    if(
      B.includes('건강한저녁')
    ){

      return '건강한저녁';

    }


    if(
      B.includes('샐러드뷔페')
    ){

      return '샐러드뷔페';

    }


    if(
      B.includes('멀티바')
    ){

      return '멀티바';

    }

  }


  return '';

}


/* =========================================================
   엑셀 1개 분석
========================================================= */

async function parseExcelFile(file){

  const buf =
    await file.arrayBuffer();


  const wb =
    XLSX.read(buf,{
      type:'array',
      cellDates:true
    });


  const ws =
    wb.Sheets[wb.SheetNames[0]];


  const rows =
    XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:null,
        raw:true
      }
    );


  if(rows.length < 3){

    throw new Error(
      '엑셀 내용이 너무 적습니다.'
    );

  }


  /* =====================================================
     날짜 열 찾기
  ===================================================== */

  const header =
    rows[1] || [];


  const dateCols = [];


  for(
    let c=0;
    c<header.length;
    c++
  ){

    const k =
      dateKey(header[c]);


    if(
      /^\d{4}-\d{2}-\d{2}$/.test(k)
    ){

      dateCols.push([
        c,
        k
      ]);

    }

  }


  if(!dateCols.length){

    throw new Error(
      '2번째 행에서 날짜를 찾지 못했습니다.'
    );

  }


  /* =====================================================
     메뉴 분석
  ===================================================== */

  const result = [];

  let meal = '';

  let currentSub = '';

  let order = 0;


  for(
    let r=2;
    r<rows.length;
    r++
  ){

    const row =
      rows[r] || [];


    /* null 방지 */

    const a =
      clean(row[0]);

    const b =
      clean(row[1]);

    const c =
      clean(row[2]);


    const A =
      compact(a);

    const B =
      compact(b);

    const C =
      compact(c);


    /* 원산지 부분부터는 메뉴가 아님 */

    if(
      A.startsWith('원산지') ||
      B.startsWith('원산지')
    ){

      break;

    }


    /* =================================================
       식사 종류 변경
    ================================================= */

    if(A === '조식'){

      meal = '조식';

      currentSub = '';

      order = 0;

    }


    else if(A === '중식'){

      meal = '중식';

      currentSub = '';

      order = 0;

    }


    else if(A === '석식'){

      meal = '석식';

      currentSub = '';

      order = 0;

    }


    /* =================================================
       조식 분류
    ================================================= */

    if(meal === '조식'){

      if(B.includes('활기찬아침')){

        currentSub =
          '활기찬아침';

      }


      else if(B.includes('plus코너')){

        currentSub =
          'PLUS코너';

      }


      else if(
        A.includes('t/o간편식') ||
        A.includes('to간편식')
      ){

        currentSub =
          'T/O간편식';

      }

    }


    /* =================================================
       중식 분류
    ================================================= */

    if(meal === '중식'){

      if(B.includes('오늘은집밥')){

        currentSub =
          '오늘은집밥';

      }


      else if(B.includes('오늘은일품')){

        currentSub =
          '오늘은일품';

      }


      else if(B.includes('멀티바')){

        currentSub =
          '멀티바';

      }


      else if(
        A.includes('t/o샐러드') ||
        A.includes('to샐러드')
      ){

        currentSub =
          'T/O샐러드(예약제)';

      }

    }


    /* =================================================
       석식 분류
    ================================================= */

    if(meal === '석식'){

      if(B.includes('건강한저녁')){

        currentSub =
          '건강한저녁';

      }


      else if(B.includes('샐러드뷔페')){

        currentSub =
          '샐러드뷔페';

      }


      else if(B.includes('멀티바')){

        currentSub =
          '멀티바';

      }

    }


    if(!meal){

      continue;

    }


    /* =================================================
       메뉴 데이터 저장
    ================================================= */

    for(
      const [col,k] of dateCols
    ){

      const value =
        clean(row[col]);


      if(!value){

        continue;

      }


      /* 안내문 제외 */

      if(
        value.includes('올리브식권') ||
        value.includes('원 산 지')
      ){

        continue;

      }


      result.push({

        menu_date:k,

        meal_type:meal,

        sub_type:currentSub || null,

        menu_name:value,

        sort_order:order++

      });

    }

  }


  return result;

}


/* =========================================================
   미리보기
========================================================= */

$('previewBtn').onclick = async () => {

  const file1 =
    $('file1').files[0];

  const file2 =
    $('file2').files[0];


  if(!file1 && !file2){

    $('status').textContent =
      '엑셀파일을 하나 이상 선택하세요.';

    return;

  }


  $('previewBtn').disabled = true;

  $('uploadBtn').disabled = true;


  $('status').textContent =
    '엑셀파일을 분석하는 중입니다...';


  try{

    parsed = [];


    /* 1주차 */

    if(file1){

      const data1 =
        await parseExcelFile(file1);

      parsed.push(...data1);

    }


    /* 2주차 */

    if(file2){

      const data2 =
        await parseExcelFile(file2);

      parsed.push(...data2);

    }


    if(!parsed.length){

      throw new Error(
        '메뉴를 찾지 못했습니다. 엑셀 형식을 확인해주세요.'
      );

    }


    /* =================================================
       날짜 정렬
    ================================================= */

    parsed.sort((a,b)=>{

      if(a.menu_date !== b.menu_date){

        return a.menu_date.localeCompare(
          b.menu_date
        );

      }

      return a.sort_order - b.sort_order;

    });


    const grouped = {};


    parsed.forEach(x=>{

      if(!grouped[x.menu_date]){

        grouped[x.menu_date] = [];

      }

      grouped[x.menu_date].push(x);

    });


    const dates =
      Object.keys(grouped).sort();


    /* =================================================
       미리보기 표
    ================================================= */

    $('preview').classList.remove('hidden');


    $('preview').innerHTML =

      '<table>' +

      '<tr>' +
      '<th>날짜</th>' +
      '<th>조식</th>' +
      '<th>중식</th>' +
      '<th>석식</th>' +
      '<th>총 메뉴</th>' +
      '</tr>' +

      dates.map(d=>{

        const list =
          grouped[d];


        return `

          <tr>

            <td>${d}</td>

            <td>
              ${list.filter(
                x=>x.meal_type==='조식'
              ).length}
            </td>

            <td>
              ${list.filter(
                x=>x.meal_type==='중식'
              ).length}
            </td>

            <td>
              ${list.filter(
                x=>x.meal_type==='석식'
              ).length}
            </td>

            <td>
              ${list.length}
            </td>

          </tr>

        `;

      }).join('') +

      '</table>';


    /* =================================================
       소분류 인식 결과
    ================================================= */

    const categoryCount = {};


    parsed.forEach(x=>{

      if(!x.sub_type){

        return;

      }


      const key =
        x.meal_type +
        '|' +
        x.sub_type;


      categoryCount[key] =
        (categoryCount[key] || 0) + 1;

    });


    let categoryText =
      '<div style="margin-top:18px;font-weight:bold;">소분류 인식 결과</div>';


    const orderList = [

      ['조식','활기찬아침'],
      ['조식','PLUS코너'],
      ['조식','T/O간편식'],

      ['중식','오늘은집밥'],
      ['중식','오늘은일품'],
      ['중식','멀티바'],
      ['중식','T/O샐러드(예약제)'],

      ['석식','건강한저녁'],
      ['석식','샐러드뷔페'],
      ['석식','멀티바']

    ];


    orderList.forEach(([mealName,subName])=>{

      const key =
        mealName + '|' + subName;


      const count =
        categoryCount[key] || 0;


      if(count > 0){

        categoryText +=
          `<div style="margin-top:8px;">
            ${mealName} · ${subName}: ${count}개
          </div>`;

      }

    });


    $('status').innerHTML =

      `총 <strong>${dates.length}일</strong> /
       <strong>${parsed.length}개</strong> 메뉴를 확인했습니다.
       <br><br>` +

      categoryText +

      `<br>
       내용이 맞으면 "메뉴 업데이트"를 눌러주세요.`;


    $('uploadBtn').disabled = false;


  }

  catch(e){

    console.error(e);


    $('preview').classList.add('hidden');


    $('status').textContent =
      '엑셀 분석 오류: ' +
      e.message;


    $('uploadBtn').disabled = true;

  }


  $('previewBtn').disabled = false;

};


/* =========================================================
   메뉴 업데이트
========================================================= */

$('uploadBtn').onclick = async () => {

  if(!parsed.length){

    return;

  }


  $('uploadBtn').disabled = true;


  $('status').textContent =
    '기존 메뉴를 지우고 새 메뉴를 저장하는 중입니다...';


  try{

    /* =================================================
       날짜 목록
    ================================================= */

    const dates = [

      ...new Set(
        parsed.map(x=>x.menu_date)
      )

    ].sort();


    /* =================================================
       해당 날짜 기존 메뉴 삭제
    ================================================= */

    for(
      const d of dates
    ){

      const {error} =
        await sb
          .from('menus')
          .delete()
          .eq('menu_date',d);


      if(error){

        throw error;

      }

    }


    /* =================================================
       새 메뉴 저장
    ================================================= */

    for(
      let i=0;
      i<parsed.length;
      i+=500
    ){

      const batch =
        parsed.slice(i,i+500);


      const {error} =
        await sb
          .from('menus')
          .insert(batch);


      if(error){

        throw error;

      }

    }


    $('status').innerHTML =

      `✅ <strong>업데이트 완료!</strong>
       <br><br>
       ${dates[0]} ~ ${dates[dates.length-1]}
       <br>
       총 ${parsed.length}개 메뉴가 저장되었습니다.
       <br><br>
       일반 메뉴 페이지를 새로고침하면 반영됩니다.`;


  }

  catch(e){

    console.error(e);


    $('status').textContent =
      '저장 오류: ' +
      e.message;


    $('uploadBtn').disabled = false;

  }

};


/* =========================================================
   최초 실행
========================================================= */

refresh();

</script>

</body>
</html>
