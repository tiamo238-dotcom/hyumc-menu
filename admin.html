<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>식단 관리자</title>
<link rel="stylesheet" href="style.css">

<style>
.file-box{
  margin:14px 0;
  padding:14px;
  border:1px dashed #d8ccc5;
  border-radius:14px;
  background:#fffaf7
}

.file-title{
  font-weight:800;
  font-size:16px;
  margin-bottom:10px
}

.category-result{
  line-height:2.1
}
</style>
</head>

<body>

<div class="admin-wrap">

<section class="hero">
  <div class="logo">👩‍🍳</div>
  <div class="title">식단 관리자</div>
  <div class="subtitle">엑셀파일을 올리면 메뉴가 업데이트됩니다.</div>
</section>

<section id="loginCard" class="admin-card">

  <h2>🔐 관리자 로그인</h2>

  <p class="small">
    관리자 계정으로 로그인해야 메뉴를 수정할 수 있습니다.
  </p>

  <input
    id="email"
    type="email"
    placeholder="관리자 이메일"
    style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:10px"
  >

  <input
    id="password"
    type="password"
    placeholder="비밀번호"
    style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:8px"
  >

  <button class="action" id="loginBtn">로그인</button>

  <div id="loginStatus" class="status"></div>

</section>


<section id="uploadCard" class="admin-card hidden">

  <h2>📁 새 식단 업로드</h2>

  <p class="small">
    1주차와 2주차 식단 엑셀파일을 각각 선택하세요.
  </p>


  <div class="file-box">

    <div class="file-title">
      📅 1주차 식단
    </div>

    <input
      id="file1"
      type="file"
      accept=".xlsx,.xls"
    >

  </div>


  <div class="file-box">

    <div class="file-title">
      📅 2주차 식단
    </div>

    <input
      id="file2"
      type="file"
      accept=".xlsx,.xls"
    >

  </div>


  <button
    class="action secondary"
    id="previewBtn"
  >
    1. 엑셀 미리보기
  </button>


  <div id="preview" class="preview hidden"></div>


  <button
    class="action"
    id="uploadBtn"
    disabled
  >
    2. 메뉴 업데이트
  </button>


  <div id="status" class="status"></div>


  <button
    class="action secondary"
    id="logoutBtn"
  >
    로그아웃
  </button>

</section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="js/config.js"></script>


<script>

const sb=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $=id=>document.getElementById(id);

let parsed=[];


/* 로그인 상태 확인 */

async function refresh(){

  const {data,error}=await sb.auth.getSession();

  if(error){

    $('loginStatus').textContent=error.message;

    return;
  }

  const logged=!!data.session;

  $('loginCard').classList.toggle(
    'hidden',
    logged
  );

  $('uploadCard').classList.toggle(
    'hidden',
    !logged
  );
}


sb.auth.onAuthStateChange(
  ()=>{
    refresh();
  }
);


/* 로그인 */

$('loginBtn').onclick=async()=>{

  const email=$('email').value.trim();

  const password=$('password').value;


  if(!email||!password){

    $('loginStatus').textContent=
      '이메일과 비밀번호를 입력하세요.';

    return;
  }


  $('loginBtn').disabled=true;

  $('loginStatus').textContent=
    '로그인 중...';


  const {error}=await sb.auth.signInWithPassword({
    email,
    password
  });


  $('loginStatus').textContent=
    error
      ? '로그인 실패: '+error.message
      : '로그인 성공!';


  $('loginBtn').disabled=false;

  await refresh();

};


/* 로그아웃 */

$('logoutBtn').onclick=async()=>{

  await sb.auth.signOut();

  await refresh();

};


/* 문자열 정리 */

function clean(v){

  return String(v??'')
    .replace(/\r/g,'')
    .trim();

}


/*
  Excel 날짜를 시간대 변환 없이
  YYYY-MM-DD 형태로 변환

  ※ 날짜 하루 밀림 방지를 위한 핵심 부분
*/

function dateKey(v){

  if(v instanceof Date && !isNaN(v)){

    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;

  }


  if(typeof v==='number'){

    const d=XLSX.SSF.parse_date_code(v);

    if(d){

      return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;

    }

  }


  const s=clean(v);

  const m=s.match(
    /(20\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/
  );


  if(m){

    return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;

  }


  return s;

}


/* 공백과 줄바꿈 정리 */

function normalized(v){

  return clean(v)
    .replace(/\s+/g,' ')
    .replace(/\n/g,'');

}


/*
  셀 텍스트 안의 시간 정보 추출
  예: '활기찬\n아침\n(6:50~ 9:00)' → '6:50~9:00'
*/

function extractTime(v){

  const s=clean(v);

  const m=s.match(
    /\(([^)]*\d[^)]*)\)/
  );


  return m
    ? m[1].replace(/\s+/g,'')
    : null;

}


/*
  주말(토/일) 여부 판별

  UTC 기준으로 계산하여
  한국에서 요일이 밀리는 문제를 방지
*/

function isWeekend(k){

  const m=
    String(k).match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if(!m) return false;


  const wd=
    new Date(
      Date.UTC(
        Number(m[1]),
        Number(m[2])-1,
        Number(m[3])
      )
    ).getUTCDay();


  return wd===0 || wd===6;

}


/* 식단 분류 찾기 */

function detectCategory(meal,a,b){

  const aa=normalized(a);

  const bb=normalized(b);


  /* 조식 */

  if(meal==='조식'){

    if(
      (aa.includes('T/O')||aa.includes('take')) &&
      aa.includes('간편식')
    ){

      return 'T/O 간편식';

    }


    /*
      구 형식 호환:
      'take·out(간편식)'이 B열에 오는 경우
    */

    if(
      (bb.includes('T/O')||bb.includes('take')) &&
      bb.includes('간편식')
    ){

      return 'T/O 간편식';

    }


    if(
      bb.includes('PLUS') &&
      bb.includes('코너')
    ){

      return 'PLUS 코너';

    }


    if(
      bb.includes('활기찬') &&
      bb.includes('아침')
    ){

      return '활기찬 아침';

    }


    return null;

  }


  /* 중식 */

  if(meal==='중식'){

    if(
      (aa.includes('T/O')||aa.includes('take')) &&
      aa.includes('샐러드')
    ){

      return 'T/O 샐러드 (예약제)';

    }


    /*
      구 형식 호환:
      'take·out\n샐러드'가 B열에 오는 경우
    */

    if(
      (bb.includes('T/O')||bb.includes('take')) &&
      bb.includes('샐러드')
    ){

      return 'T/O 샐러드 (예약제)';

    }


    if(
      bb.includes('오늘은') &&
      bb.includes('집밥')
    ){

      return '오늘은 집밥';

    }


    if(
      bb.includes('오늘은') &&
      bb.includes('일품')
    ){

      return '오늘은 일품';

    }


    /*
      구 형식 호환:
      9월 이전에는 '오늘은 집밥'/'오늘은 일품' 구분 없이
      '행복한 점심' 하나로만 표기되어 있었음 → '오늘은 집밥'으로 매핑
    */

    if(
      bb.includes('행복한') &&
      bb.includes('점심')
    ){

      return '오늘은 집밥';

    }


    if(bb==='멀티바'){

      return '멀티바';

    }


    /*
      기존 형식의 샐러드/샌드위치/콤보도
      T/O 샐러드로 묶어줌
    */

    if(bb==='샐러드'){

      return 'T/O 샐러드 (예약제)';

    }


    if(bb==='샌드위치'){

      return 'T/O 샐러드 (예약제)';

    }


    if(bb==='콤보'){

      return 'T/O 샐러드 (예약제)';

    }


    return null;

  }


  /* 석식 */

  if(meal==='석식'){

    if(
      bb.includes('건강한') &&
      bb.includes('저녁')
    ){

      return '건강한 저녁';

    }


    if(
      bb.includes('샐러드') &&
      bb.includes('뷔페')
    ){

      return '샐러드 뷔페';

    }


    if(bb==='멀티바'){

      return '멀티바';

    }


    return null;

  }


  return null;

}


/* 조식 / 중식 / 석식 판별 */

function getMealFromRow(a){

  const aa=normalized(a);


  if(aa==='조식') return '조식';

  if(aa==='중식') return '중식';

  if(aa==='석식') return '석식';


  return null;

}


/*
  '원산지' 셀에 적힌 안내문구를
  '*' 기준으로 문장 단위로 분리

  예:
  '* 문장1.        * 문장2. \n(내용)   \n* 문장3.'

  →
  ['문장1.', '문장2. (내용)', '문장3.']
*/

function parseNotice(raw){

  const s=clean(raw);


  return s

    .split('*')

    .map(
      x=>
        x
          .replace(/\s+/g,' ')
          .trim()
    )

    .filter(Boolean);

}


/* 하나의 엑셀 파일 분석 */

async function parseFile(file){

  const buf=await file.arrayBuffer();


  /*
    cellDates:false를 사용하여
    Excel 날짜 숫자를 직접 읽습니다.

    이것도 날짜 하루 밀림 방지를 위한 핵심입니다.
  */

  const wb=XLSX.read(
    buf,
    {
      type:'array',
      cellDates:false
    }
  );


  const ws=
    wb.Sheets[wb.SheetNames[0]];


  const rows=
    XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:null,
        raw:true
      }
    );


  if(rows.length<3){

    throw new Error(
      `${file.name}: 엑셀 내용이 너무 적습니다.`
    );

  }


  const header=rows[1]||[];

  const dateCols=[];


  for(
    let c=0;
    c<header.length;
    c++
  ){

    const k=dateKey(header[c]);


    if(
      /^\d{4}-\d{2}-\d{2}$/.test(k)
    ){

      dateCols.push([c,k]);

    }

  }


  if(!dateCols.length){

    throw new Error(
      `${file.name}: 2번째 행에서 날짜를 찾지 못했습니다.`
    );

  }


  const result=[];


  let meal=null;

  let sub=null;

  let subTime=null;

  let order=0;

  let noticeLines=[];


  for(
    let r=2;
    r<rows.length;
    r++
  ){

    const a=clean(rows[r]?.[0]);

    const b=clean(rows[r]?.[1]);


    /*
      원산지부터는 메뉴가 아니므로 종료

      이 행의 날짜 칸에 적힌 안내문구를
      최하단 공지사항으로 사용
    */

    if(
      normalized(a)==='원산지' ||
      normalized(a)==='원 산 지' ||
      normalized(b)==='원산지' ||
      normalized(b)==='원 산 지'
    ){

      for(
        const [col]
        of dateCols
      ){

        const raw=
          rows[r]?.[col];


        if(clean(raw)){

          noticeLines=
            parseNotice(raw);

          break;

        }

      }


      break;

    }


    const detectedMeal=
      getMealFromRow(a);


    if(detectedMeal){

      meal=detectedMeal;

      sub=null;

      order=0;

    }


    const detectedSub=
      detectCategory(
        meal,
        a,
        b
      );


    if(detectedSub){

      sub=detectedSub;

      subTime=
        extractTime(a)||
        extractTime(b);

    }


    if(!meal || !sub){

      continue;

    }


    for(
      const [col,k]
      of dateCols
    ){

      const value=
        clean(rows[r]?.[col]);


      if(
        !value ||
        value==='**' ||
        value.includes('미운영')
      ){

        continue;

      }


      /*
        주말 중식은 '오늘은 집밥' / '오늘은 일품'
        구분 없이 단일메뉴로 운영되므로
        하나의 분류로 합쳐서 저장
      */

      let finalSub=sub;


      if(
        meal==='중식' &&
        isWeekend(k) &&
        (
          sub==='오늘은 집밥' ||
          sub==='오늘은 일품'
        )
      ){

        finalSub='오늘은 집밥';

      }


      result.push({

        menu_date:k,

        meal_type:meal,

        sub_type:finalSub,

        sub_time:subTime,

        menu_name:value,

        sort_order:order++

      });

    }

  }


  if(!result.length){

    throw new Error(
      `${file.name}: 메뉴를 찾지 못했습니다. 엑셀 형식을 확인해주세요.`
    );

  }


  /*
    이 파일에 포함된 모든 날짜에
    동일한 공지사항(원산지 안내문구)을 저장
  */

  if(noticeLines.length){

    const noticeText=
      noticeLines.join('\n');


    for(
      const [,k]
      of dateCols
    ){

      result.push({

        menu_date:k,

        meal_type:'공지',

        sub_type:'원산지',

        sub_time:null,

        menu_name:noticeText,

        sort_order:0

      });

    }

  }


  return result;

}


/* 중복 메뉴 제거 */

function uniqueMenus(items){

  const seen=new Set();

  const out=[];


  for(const x of items){

    const key=[
      x.menu_date,
      x.meal_type,
      x.sub_type,
      x.menu_name,
      x.sort_order
    ].join('|');


    if(seen.has(key)){

      continue;

    }


    seen.add(key);

    out.push(x);

  }


  return out;

}


/* 미리보기 */

function renderPreview(){

  const grouped={};


  parsed.forEach(
    x=>(grouped[x.menu_date]??=[]).push(x)
  );


  const dates=
    Object.keys(grouped).sort();


  $('preview').classList.remove(
    'hidden'
  );


  $('preview').innerHTML=
    '<table>'+
    '<tr>'+
    '<th>날짜</th>'+
    '<th>조식</th>'+
    '<th>중식</th>'+
    '<th>석식</th>'+
    '<th>총 메뉴</th>'+
    '</tr>'+
    dates.map(d=>{

      const list=grouped[d];


      return `
        <tr>
          <td>${d}</td>
          <td>${list.filter(x=>x.meal_type==='조식').length}</td>
          <td>${list.filter(x=>x.meal_type==='중식').length}</td>
          <td>${list.filter(x=>x.meal_type==='석식').length}</td>
          <td>${list.length}</td>
        </tr>
      `;

    }).join('')+
    '</table>';


  const foodItems=
    parsed.filter(
      x=>x.meal_type!=='공지'
    );


  const noticeCount=
    parsed.filter(
      x=>x.meal_type==='공지'
    ).length;


  const counts={};


  foodItems.forEach(x=>{

    counts[x.sub_type]=
      (counts[x.sub_type]||0)+1;

  });


  $('status').innerHTML=`

    총 <strong>${dates.length}일 / ${foodItems.length}개</strong>
    메뉴를 확인했습니다.

    <br>

    📋 원산지·알레르기 안내문구:
    ${noticeCount}일 인식됨

    <br><br>

    <div class="category-result">

      <strong>소분류 인식 결과</strong>

      <br>

      ☀️ 활기찬 아침:
      ${counts['활기찬 아침']||0}개

      <br>

      ➕ PLUS 코너:
      ${counts['PLUS 코너']||0}개

      <br>

      🥪 T/O 간편식:
      ${counts['T/O 간편식']||0}개

      <br><br>

      🍚 오늘은 집밥:
      ${counts['오늘은 집밥']||0}개

      <br>

      🍜 오늘은 일품:
      ${counts['오늘은 일품']||0}개

      <br>

      🌿 멀티바:
      ${counts['멀티바']||0}개

      <br>

      🥗 T/O 샐러드 (예약제):
      ${counts['T/O 샐러드 (예약제)']||0}개

      <br><br>

      🌙 건강한 저녁:
      ${counts['건강한 저녁']||0}개

      <br>

      🥗 샐러드 뷔페:
      ${counts['샐러드 뷔페']||0}개

    </div>

    <br>

    내용이 맞으면
    "메뉴 업데이트"를 눌러주세요.

  `;

}


/* 엑셀 미리보기 */

$('previewBtn').onclick=async()=>{

  const files=[
    $('file1').files[0],
    $('file2').files[0]
  ].filter(Boolean);


  if(!files.length){

    $('status').textContent=
      '1주차 또는 2주차 엑셀파일을 선택하세요.';

    return;

  }


  $('previewBtn').disabled=true;

  $('uploadBtn').disabled=true;

  $('status').textContent=
    '엑셀을 분석하는 중입니다...';


  try{

    const results=[];


    for(
      const file of files
    ){

      results.push(
        await parseFile(file)
      );

    }


    parsed=
      uniqueMenus(
        results.flat()
      ).sort(
        (a,b)=>
          a.menu_date.localeCompare(b.menu_date) ||
          a.meal_type.localeCompare(b.meal_type) ||
          a.sort_order-b.sort_order
      );


    renderPreview();


    $('uploadBtn').disabled=false;

  }
  catch(e){

    parsed=[];

    $('preview').classList.add(
      'hidden'
    );

    $('status').textContent=
      '엑셀 분석 오류: '+e.message;

  }
  finally{

    $('previewBtn').disabled=false;

  }

};


/* 메뉴 업데이트 */

$('uploadBtn').onclick=async()=>{

  if(!parsed.length) return;


  $('uploadBtn').disabled=true;


  $('status').textContent=
    '기존 메뉴를 지우고 새 메뉴를 저장하는 중...';


  try{

    const dates=[
      ...new Set(
        parsed.map(x=>x.menu_date)
      )
    ].sort();


    /*
      이번에 업로드한 날짜의 기존 메뉴만 삭제
    */

    for(
      const d of dates
    ){

      const {error}=
        await sb
          .from('menus')
          .delete()
          .eq('menu_date',d);


      if(error) throw error;

    }


    /*
      500개 단위로 저장
    */

    for(
      let i=0;
      i<parsed.length;
      i+=500
    ){

      const {error}=
        await sb
          .from('menus')
          .insert(
            parsed.slice(i,i+500)
          );


      if(error) throw error;

    }


    $('status').innerHTML=`

      ✅ <strong>업데이트 완료!</strong>

      <br>

      ${dates[0]} ~ ${dates[dates.length-1]}

      <br>

      총 ${parsed.length}개 메뉴가 저장되었습니다.

      <br><br>

      일반 메뉴 페이지를 새로고침하면
      반영됩니다.

    `;

  }
  catch(e){

    $('status').textContent=
      '저장 오류: '+e.message;

    $('uploadBtn').disabled=false;

  }

};


refresh();

</script>

</body>
</html>
