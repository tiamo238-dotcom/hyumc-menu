<script>

/* =====================================================
   Supabase
===================================================== */

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const $ =
  id => document.getElementById(id);


let parsed = [];



/* =====================================================
   로그인 상태
===================================================== */

async function refresh(){

  const { data, error } =
    await sb.auth.getSession();


  if(error){

    $('loginStatus').textContent =
      error.message;

    return;

  }


  const logged =
    !!data.session;


  $('loginCard')
    .classList
    .toggle(
      'hidden',
      logged
    );


  $('uploadCard')
    .classList
    .toggle(
      'hidden',
      !logged
    );

}


sb.auth.onAuthStateChange(
  () => refresh()
);



/* =====================================================
   로그인
===================================================== */

$('loginBtn').onclick =
async()=>{

  const email =
    $('email')
      .value
      .trim();


  const password =
    $('password')
      .value;


  if(!email || !password){

    $('loginStatus').textContent =
      '이메일과 비밀번호를 입력하세요.';

    return;

  }


  $('loginBtn').disabled =
    true;


  $('loginStatus').textContent =
    '로그인 중...';


  const { error } =
    await sb.auth.signInWithPassword({
      email,
      password
    });


  $('loginStatus').textContent =
    error
      ? '로그인 실패: ' + error.message
      : '로그인 성공!';


  $('loginBtn').disabled =
    false;


  await refresh();

};



/* =====================================================
   로그아웃
===================================================== */

$('logoutBtn').onclick =
async()=>{

  await sb.auth.signOut();

  await refresh();

};



/* =====================================================
   날짜 변환
   ★ Date 객체를 사용하지 않음
   ★ 날짜 하루 밀림 방지
===================================================== */

function dateKey(v){

  /* 엑셀 날짜 숫자 */

  if(typeof v === 'number'){

    const d =
      XLSX.SSF.parse_date_code(v);


    if(d){

      return (
        String(d.y).padStart(4,'0') +
        '-' +
        String(d.m).padStart(2,'0') +
        '-' +
        String(d.d).padStart(2,'0')
      );

    }

  }


  const s =
    String(v ?? '').trim();


  if(
    /^\d{4}-\d{2}-\d{2}$/.test(s)
  ){

    return s;

  }


  const m =
    s.match(
      /^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/
    );


  if(m){

    return (
      m[1] +
      '-' +
      String(m[2]).padStart(2,'0') +
      '-' +
      String(m[3]).padStart(2,'0')
    );

  }


  return s;

}



/* =====================================================
   문자열 정리
===================================================== */

function clean(v){

  return String(v ?? '')
    .replace(/\r/g,'')
    .replace(/\t/g,'')
    .trim();

}



/* =====================================================
   비교용 문자열
===================================================== */

function norm(v){

  return clean(v)
    .toLowerCase()
    .replace(/\s+/g,'')
    .replace(/[·•ㆍ]/g,'')
    .replace(/[()（）]/g,'')
    .replace(/[-_]/g,'');

}



/* =====================================================
   새 양식 분류 이름
===================================================== */

function categoryName(v){

  const n =
    norm(v);


  /* 조식 */

  if(
    n.includes('활기찬아침')
  ){

    return '활기찬 아침';

  }


  if(
    n.includes('to간편식') ||
    n.includes('t/o간편식')
  ){

    return 'T/O 간편식';

  }


  if(
    n.includes('plus코너') ||
    n.includes('plus')
  ){

    return 'PLUS 코너';

  }


  /* 중식 */

  if(
    n.includes('오늘은집밥')
  ){

    return '오늘은 집밥';

  }


  if(
    n.includes('오늘은일품')
  ){

    return '오늘은 일품';

  }


  if(
    n.includes('to샐러드') ||
    n.includes('tosalad')
  ){

    return 'T/O 샐러드(예약제)';

  }


  /* 석식 */

  if(
    n.includes('건강한저녁')
  ){

    return '건강한 저녁';

  }


  if(
    n.includes('샐러드뷔페')
  ){

    return '샐러드 뷔페';

  }


  if(
    n === '멀티바' ||
    n.includes('멀티바')
  ){

    return '멀티바';

  }


  if(
    n.includes('샐러드')
  ){

    return '샐러드';

  }


  if(
    n.includes('샌드위치')
  ){

    return '샌드위치';

  }


  if(
    n.includes('콤보')
  ){

    return '콤보';

  }


  return clean(v);

}



/* =====================================================
   새 양식인지 확인
===================================================== */

function isNewFormat(rows){

  let text='';


  for(
    let r=0;
    r<Math.min(rows.length,45);
    r++
  ){

    for(
      let c=0;
      c<Math.min(rows[r]?.length || 0,8);
      c++
    ){

      text +=
        ' ' +
        clean(rows[r]?.[c]);

    }

  }


  const n =
    norm(text);


  return (
    n.includes('활기찬아침') &&
    n.includes('오늘은집밥') &&
    n.includes('오늘은일품') &&
    n.includes('건강한저녁')
  );

}



/* =====================================================
   새 양식 분석
===================================================== */

function parseNewFormat(rows,dateCols){

  const result=[];

  let meal=null;

  let category=null;

  let categoryType=null;

  let order=0;


  for(
    let r=2;
    r<rows.length;
    r++
  ){

    const row =
      rows[r] || [];


    const a =
      clean(row[0]);

    const b =
      clean(row[1]);


    const na =
      norm(a);

    const nb =
      norm(b);


    /* 원산지에서 종료 */

    if(
      na.includes('원산지') ||
      nb.includes('원산지')
    ){

      break;

    }


    /* =========================
       식사 종류
    ========================= */

    if(
      na === '조식' ||
      na.includes('조식')
    ){

      meal='조식';

      category=null;

      categoryType=null;

      order=0;

    }


    if(
      na === '중식' ||
      na.includes('중식')
    ){

      meal='중식';

      category=null;

      categoryType=null;

      order=0;

    }


    if(
      na === '석식' ||
      na.includes('석식')
    ){

      meal='석식';

      category=null;

      categoryType=null;

      order=0;

    }


    if(!meal){

      continue;

    }



    /* =========================
       조식
    ========================= */

    if(
      meal==='조식'
    ){

      if(
        nb.includes('활기찬아침')
      ){

        category='활기찬 아침';

        categoryType='main';

      }


      else if(
        nb.includes('plus')
      ){

        /*
          PLUS 코너는
          활기찬 아침의 하위 메뉴
        */

        category='활기찬 아침';

        categoryType='plus';

      }


      else if(
        na.includes('to간편식') ||
        nb.includes('to간편식')
      ){

        category='T/O 간편식';

        categoryType='to';

      }

    }



    /* =========================
       중식
    ========================= */

    if(
      meal==='중식'
    ){

      if(
        nb.includes('오늘은집밥')
      ){

        category='오늘은 집밥';

        categoryType='main';

      }


      else if(
        nb.includes('오늘은일품')
      ){

        category='오늘은 일품';

        categoryType='main';

      }


      else if(
        nb.includes('멀티바')
      ){

        /*
          멀티바가 어느 메뉴 아래 있는지
          직전에 기억하고 있음
        */

        if(category==='오늘은 집밥'){

          category='오늘은 집밥';

          categoryType='multi-home';

        }

        else if(category==='오늘은 일품'){

          category='오늘은 일품';

          categoryType='multi-item';

        }

      }


      else if(
        na.includes('to샐러드') ||
        nb.includes('샐러드')
        && na.includes('to')
      ){

        category='T/O 샐러드(예약제)';

        categoryType='to-salad';

      }


      /*
        T/O 샐러드 아래의
        샐러드 / 샌드위치 / 콤보
      */

      if(
        category==='T/O 샐러드(예약제)'
      ){

        if(nb.includes('샌드위치')){

          categoryType='to-sandwich';

        }
        else if(nb.includes('콤보')){

          categoryType='to-combo';

        }
        else if(nb.includes('샐러드')){

          categoryType='to-salad';

        }

      }

    }



    /* =========================
       석식
    ========================= */

    if(
      meal==='석식'
    ){

      if(
        nb.includes('건강한저녁')
      ){

        category='건강한 저녁';

        categoryType='main';

      }


      else if(
        nb.includes('샐러드뷔페')
      ){

        category='샐러드 뷔페';

        categoryType='salad-buffet';

      }


      else if(
        nb.includes('멀티바')
      ){

        category='멀티바';

        categoryType='multi';

      }

    }



    if(!category){

      continue;

    }



    /* =========================
       메뉴 저장
    ========================= */

    for(
      const [col,k]
      of dateCols
    ){

      const value =
        clean(row[col]);


      if(
        !value ||
        value==='**'
      ){

        continue;

      }


      /*
        DB에는 기존 구조를 그대로 사용합니다.

        meal_type = 조식 / 중식 / 석식

        sub_type =
          활기찬 아침
          활기찬 아침 > PLUS 코너
          T/O 간편식
          오늘은 집밥
          오늘은 집밥 > 멀티바
          오늘은 일품
          오늘은 일품 > 멀티바
          T/O 샐러드(예약제)
          T/O 샐러드(예약제) > 샌드위치
          ...
      */


      let sub=category;


      if(
        categoryType==='plus'
      ){

        sub='활기찬 아침 > PLUS 코너';

      }


      else if(
        categoryType==='multi-home'
      ){

        sub='오늘은 집밥 > 멀티바';

      }


      else if(
        categoryType==='multi-item'
      ){

        sub='오늘은 일품 > 멀티바';

      }


      else if(
        categoryType==='to-sandwich'
      ){

        sub='T/O 샐러드(예약제) > 샌드위치';

      }


      else if(
        categoryType==='to-combo'
      ){

        sub='T/O 샐러드(예약제) > 콤보';

      }


      else if(
        categoryType==='to-salad'
      ){

        sub='T/O 샐러드(예약제) > 샐러드';

      }


      result.push({

        menu_date:k,

        meal_type:meal,

        sub_type:sub,

        menu_name:value,

        sort_order:order++

      });

    }

  }


  return result;

}



/* =====================================================
   기존 양식 분석
   기존 식단도 계속 사용할 수 있도록 유지
===================================================== */

function parseOldFormat(rows,dateCols){

  const result=[];

  let meal=null;

  let sub=null;

  let order=0;


  for(
    let r=2;
    r<rows.length;
    r++
  ){

    const row =
      rows[r] || [];


    const a =
      clean(row[0]);

    const b =
      clean(row[1]);

    const c =
      clean(row[2]);


    const na =
      norm(a);

    const nb =
      norm(b);

    const nc =
      norm(c);


    if(
      na.includes('원산지') ||
      nb.includes('원산지')
    ){

      break;

    }


    if(
      a==='조식' ||
      a==='중식' ||
      a==='석식'
    ){

      meal=a;

      sub=null;

      order=0;

    }


    if(!meal){

      continue;

    }


    if(
      meal==='중식' &&
      nb.includes('멀티바')
    ){

      sub='멀티바';

    }


    if(
      meal==='중식' &&
      (
        nb.includes('takeout') ||
        nb.includes('샐러드')
        && na.includes('take')
      )
    ){

      sub='Take Out 샐러드';

    }


    if(
      meal==='중식' &&
      nc==='샐러드'
    ){

      sub='샐러드';

    }


    if(
      meal==='중식' &&
      nc==='샌드위치'
    ){

      sub='샌드위치';

    }


    if(
      meal==='중식' &&
      nc==='콤보'
    ){

      sub='콤보';

    }


    if(
      meal==='석식' &&
      nb.includes('멀티바')
    ){

      sub='석식 멀티바';

    }


    for(
      const [col,k]
      of dateCols
    ){

      const value =
        clean(row[col]);


      if(!value){

        continue;

      }


      result.push({

        menu_date:k,

        meal_type:meal,

        sub_type:sub,

        menu_name:value,

        sort_order:order++

      });

    }

  }


  return result;

}



/* =====================================================
   파일 하나 분석
===================================================== */

async function parseExcelFile(file){

  const buf =
    await file.arrayBuffer();


  const wb =
    XLSX.read(
      buf,
      {
        type:'array',
        cellDates:false
      }
    );


  const ws =
    wb.Sheets[
      wb.SheetNames[0]
    ];


  const rows =
    XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:null,
        raw:true
      }
    );


  if(rows.length<3){

    throw new Error(
      file.name +
      ': 엑셀 내용이 너무 적습니다.'
    );

  }


  /* 날짜 행 */

  const header =
    rows[1] || [];


  const dateCols=[];


  for(
    let c=0;
    c<header.length;
    c++
  ){

    const k =
      dateKey(header[c]);


    if(
      /^\d{4}-\d{2}-\d{2}$/.test(k)
    ){

      dateCols.push([
        c,k
      ]);

    }

  }


  if(!dateCols.length){

    throw new Error(
      file.name +
      ': 날짜를 찾지 못했습니다.'
    );

  }


  let result;


  /*
    새 양식이면 새 방식,
    아니면 기존 방식
  */

  if(
    isNewFormat(rows)
  ){

    result =
      parseNewFormat(
        rows,
        dateCols
      );

  }
  else{

    result =
      parseOldFormat(
        rows,
        dateCols
      );

  }


  if(!result.length){

    throw new Error(
      file.name +
      ': 메뉴를 찾지 못했습니다.'
    );

  }


  return result;

}



/* =====================================================
   미리보기
===================================================== */

$('previewBtn').onclick =
async()=>{

  const file1 =
    $('file1').files[0];


  const file2 =
    $('file2').files[0];


  if(!file1 || !file2){

    $('status').textContent =
      '1주차와 2주차 엑셀파일을 모두 선택하세요.';

    return;

  }


  $('previewBtn').disabled =
    true;


  $('uploadBtn').disabled =
    true;


  $('status').textContent =
    '두 엑셀파일을 분석하는 중입니다...';


  try{

    const data1 =
      await parseExcelFile(file1);


    const data2 =
      await parseExcelFile(file2);


    parsed=[
      ...data1,
      ...data2
    ];


    parsed.sort(
      (a,b)=>
        a.menu_date.localeCompare(
          b.menu_date
        )
    );


    const dates=[
      ...new Set(
        parsed.map(
          x=>x.menu_date
        )
      )
    ].sort();


    const grouped={};


    parsed.forEach(x=>{

      (
        grouped[x.menu_date] ??= []
      ).push(x);

    });


    $('preview')
      .classList
      .remove('hidden');


    $('preview').innerHTML=

      '<table>' +

      '<tr>' +
      '<th>날짜</th>' +
      '<th>조식</th>' +
      '<th>중식</th>' +
      '<th>석식</th>' +
      '<th>총 메뉴</th>' +
      '</tr>' +

      dates.map(d=>{

        const list =
          grouped[d];


        return `

          <tr>

            <td>${d}</td>

            <td>
              ${
                list.filter(
                  x=>x.meal_type==='조식'
                ).length
              }
            </td>

            <td>
              ${
                list.filter(
                  x=>x.meal_type==='중식'
                ).length
              }
            </td>

            <td>
              ${
                list.filter(
                  x=>x.meal_type==='석식'
                ).length
              }
            </td>

            <td>
              ${list.length}
            </td>

          </tr>

        `;

      }).join('') +

      '</table>';


    const plusCount =
      parsed.filter(
        x=>
          x.sub_type ===
          '활기찬 아침 > PLUS 코너'
      ).length;


    const homeMulti =
      parsed.filter(
        x=>
          x.sub_type ===
          '오늘은 집밥 > 멀티바'
      ).length;


    const itemMulti =
      parsed.filter(
        x=>
          x.sub_type ===
          '오늘은 일품 > 멀티바'
      ).length;


    const toSalad =
      parsed.filter(
        x=>
          x.sub_type.startsWith(
            'T/O 샐러드(예약제)'
          )
      ).length;


    const dinnerMulti =
      parsed.filter(
        x=>
          x.sub_type ===
          '멀티바'
        &&
          x.meal_type ===
          '석식'
      ).length;


    $('status').innerHTML=

      `
      총 <b>${dates.length}일</b> /
      <b>${parsed.length}개</b> 메뉴를 확인했습니다.

      <br><br>

      <b>새 양식 자동 분류 결과</b>

      <br><br>

      🌅 활기찬 아침 → PLUS 코너:
      ${plusCount}개

      <br><br>

      🍱 오늘은 집밥 → 멀티바:
      ${homeMulti}개

      <br><br>

      🍱 오늘은 일품 → 멀티바:
      ${itemMulti}개

      <br><br>

      🥗 T/O 샐러드(예약제):
      ${toSalad}개

      <br><br>

      🌙 석식 → 멀티바:
      ${dinnerMulti}개

      <br><br>

      날짜와 분류가 맞으면
      <b>"메뉴 업데이트"</b>를 눌러주세요.
      `;


    $('uploadBtn').disabled =
      false;


  }
  catch(e){

    console.error(e);


    $('status').textContent =
      '엑셀 분석 오류: ' +
      e.message;


    $('uploadBtn').disabled =
      true;

  }


  $('previewBtn').disabled =
    false;

};



/* =====================================================
   메뉴 업데이트
===================================================== */

$('uploadBtn').onclick =
async()=>{

  if(!parsed.length){

    return;

  }


  $('uploadBtn').disabled =
    true;


  $('status').textContent =
    '기존 메뉴를 지우고 새 메뉴를 저장하는 중입니다...';


  try{

    const dates=[
      ...new Set(
        parsed.map(
          x=>x.menu_date
        )
      )
    ].sort();


    /*
      해당 날짜의 기존 메뉴 삭제
    */

    for(
      const d of dates
    ){

      const {error} =
        await sb
          .from('menus')
          .delete()
          .eq(
            'menu_date',
            d
          );


      if(error){

        throw error;

      }

    }


    /*
      500개씩 저장
    */

    for(
      let i=0;
      i<parsed.length;
      i+=500
    ){

      const {error} =
        await sb
          .from('menus')
          .insert(
            parsed.slice(
              i,
              i+500
            )
          );


      if(error){

        throw error;

      }

    }


    $('status').innerHTML=

      `
      ✅ <b>업데이트 완료!</b>

      <br><br>

      ${dates[0]}
      ~
      ${dates[dates.length-1]}

      <br>

      총 ${dates.length}일 /
      ${parsed.length}개 메뉴가 저장되었습니다.

      <br><br>

      일반 메뉴 페이지를 새로고침하면
      반영됩니다.
      `;


  }
  catch(e){

    console.error(e);


    $('status').textContent =
      '저장 오류: ' +
      e.message;


    $('uploadBtn').disabled =
      false;

  }

};


/* 최초 실행 */

refresh();

</script>
