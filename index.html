<!doctype html>
<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>한양대학교병원 직원식당 메뉴</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>

<div class="wrap">


<section class="hero">

  <div class="logo">
    🍽️
  </div>


  <div class="title">
    한양대학교병원 직원식당 메뉴
  </div>


  <div class="subtitle">
    맛있는 식사시간 되세요 🌷
  </div>


  <div class="datebar">

    <button id="prev">
      ‹
    </button>


    <select id="dateSelect"></select>


    <button id="next">
      ›
    </button>

  </div>


  <button
    class="todaybtn"
    id="todayBtn"
  >
    오늘 메뉴로 돌아가기
  </button>

</section>



<div id="menus"></div>



<div class="notice">

※ 식자재 수급에 따라 메뉴가 변경될 수 있습니다.
<br>

※ 알레르기 주의 메뉴가 있으니 게시된 알레르기 정보를 확인해 주세요.

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>



<script>

/* =====================================================
   Supabase
===================================================== */

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const dateSelect =
  document.getElementById(
    'dateSelect'
  );


const menusEl =
  document.getElementById(
    'menus'
  );


const prev =
  document.getElementById(
    'prev'
  );


const next =
  document.getElementById(
    'next'
  );


const todayBtn =
  document.getElementById(
    'todayBtn'
  );


let dates=[];

let currentIndex=0;



/* =====================================================
   식사
===================================================== */

const groups=[

  {
    name:'조식',
    icon:'🌅'
  },

  {
    name:'중식',
    icon:'🍱'
  },

  {
    name:'석식',
    icon:'🌙'
  }

];



/* =====================================================
   아이콘
===================================================== */

const icons={

  '활기찬 아침':'🌞',

  'PLUS 코너':'✨',

  'T/O 간편식':'🥪',

  '오늘은 집밥':'🍚',

  '오늘은 일품':'🍛',

  '멀티바':'🌿',

  'T/O 샐러드(예약제)':'🥗',

  '샐러드':'🥗',

  '샌드위치':'🥪',

  '콤보':'🍙',

  '건강한 저녁':'🍲',

  '샐러드 뷔페':'🥗'

};



/* =====================================================
   날짜 표시
===================================================== */

function fmt(k){

  const parts =
    String(k).split('-');


  if(parts.length!==3){

    return k;

  }


  const y =
    Number(parts[0]);


  const m =
    Number(parts[1]);


  const d =
    Number(parts[2]);


  const localDate =
    new Date(
      y,
      m-1,
      d
    );


  const dayNames=[

    '일',
    '월',
    '화',
    '수',
    '목',
    '금',
    '토'

  ];


  return (
    `${m}월 ${d}일 ` +
    `(${dayNames[localDate.getDay()]})`
  );

}



/* =====================================================
   오늘 날짜
===================================================== */

function todayKey(){

  const now =
    new Date();


  return (

    now.getFullYear() +

    '-' +

    String(
      now.getMonth()+1
    ).padStart(2,'0') +

    '-' +

    String(
      now.getDate()
    ).padStart(2,'0')

  );

}



/* =====================================================
   날짜 불러오기
===================================================== */

async function loadDates(){

  const {
    data,
    error
  } =
    await sb
      .from('menus')
      .select('menu_date')
      .order(
        'menu_date',
        {
          ascending:true
        }
      );


  if(error){

    throw error;

  }


  dates=[

    ...new Set(

      (data || [])
        .map(
          x=>String(
            x.menu_date
          )
        )

    )

  ].sort();


  if(!dates.length){

    menusEl.innerHTML=
      '<div class="card">등록된 메뉴가 없습니다.</div>';

    return;

  }


  dateSelect.innerHTML=

    dates
      .map(
        d=>
          `<option value="${d}">
            ${fmt(d)}
          </option>`
      )
      .join('');


  const today =
    todayKey();


  currentIndex =
    dates.indexOf(today);


  if(currentIndex<0){

    currentIndex =
      dates.length-1;

  }


  showDate();

}



/* =====================================================
   메뉴 표시
===================================================== */

async function showDate(){

  const date =
    dates[currentIndex];


  dateSelect.value =
    date;


  prev.disabled =
    currentIndex<=0;


  next.disabled =
    currentIndex>=
    dates.length-1;



  const {
    data,
    error
  } =
    await sb
      .from('menus')
      .select('*')
      .eq(
        'menu_date',
        date
      )
      .order(
        'sort_order'
      )
      .order('id');


  if(error){

    menusEl.innerHTML=

      `
      <div class="card">

        메뉴를 불러오지 못했습니다.

        <br>

        ${error.message}

      </div>
      `;

    return;

  }



  /* =================================================
     식사별 분류
  ================================================= */

  const byMeal={};


  (data || []).forEach(row=>{

    const meal =
      row.meal_type || '';


    if(!byMeal[meal]){

      byMeal[meal]=[];

    }


    byMeal[meal].push(row);

  });



  menusEl.innerHTML='';



  /* =================================================
     조식 / 중식 / 석식
  ================================================= */

  groups.forEach(group=>{

    const rows =
      byMeal[group.name];


    if(
      !rows ||
      !rows.length
    ){

      return;

    }



    const card =
      document.createElement(
        'section'
      );


    card.className =
      'card';



    card.innerHTML=

      `
      <div class="card-head">

        <span class="card-icon">
          ${group.icon}
        </span>

        <span class="card-title">
          ${group.name}
        </span>

        <span class="card-sub">
          ${fmt(date)}
        </span>

      </div>
      `;



    /* =================================================
       sub_type별 분류

       예:

       오늘은 집밥
          메뉴
          메뉴

          └ 멀티바
              메뉴
              메뉴

       오늘은 일품
          메뉴

          └ 멀티바
              메뉴

       T/O 샐러드
          └ 샐러드
          └ 샌드위치
          └ 콤보
    ================================================= */


    const categories={};


    rows.forEach(row=>{

      const sub =
        String(
          row.sub_type || ''
        ).trim();


      if(!categories[sub]){

        categories[sub]=[];

      }


      categories[sub].push(row);

    });



    Object.keys(categories)
      .forEach(sub=>{

        const items =
          categories[sub];


        /*
          "오늘은 집밥 > 멀티바"
          같은 2단계 이름 처리
        */

        const parts =
          sub
            .split('>')
            .map(
              x=>x.trim()
            );



        const parent =
          parts[0];


        const child =
          parts.length>1
            ? parts[1]
            : null;



        /* =============================================
           부모 제목
        ============================================= */

        const parentKey =
          parent;


        const parentIcon =
          icons[parentKey] ||
          '🍽️';



        /*
          하위 메뉴가 없는 일반 분류
        */

        if(!child){

          const h =
            document.createElement(
              'div'
            );


          h.className =
            'subhead';


          h.textContent =
            `${parentIcon} ${parent}`;


          card.appendChild(h);



          items.forEach(
            (row,index)=>{

              const p =
                document.createElement(
                  'div'
                );


              /*
                각 분류의 첫 번째 메뉴
                메인 메뉴 강조
              */

              p.className =
                index===0
                  ? 'menu-item main-menu'
                  : 'menu-item';


              p.innerHTML =
                String(
                  row.menu_name || ''
                )
                .replace(
                  /\n/g,
                  '<br>'
                );


              card.appendChild(p);

            }
          );


          return;

        }



        /* =============================================
           부모 + 하위 메뉴
        ============================================= */

        /*
          부모 제목은 이미 만들어졌는지 확인
        */

        let parentHead =
          card.querySelector(
            `[data-parent="${CSS.escape(parent)}"]`
          );


        if(!parentHead){

          parentHead =
            document.createElement(
              'div'
            );


          parentHead.className =
            'subhead';


          parentHead.dataset.parent =
            parent;


          parentHead.textContent =
            `${parentIcon} ${parent}`;


          card.appendChild(
            parentHead
          );

        }



        /*
          하위 제목
        */

        const childHead =
          document.createElement(
            'div'
          );


        childHead.className =
          'subhead sub-subhead';


        const childIcon =
          icons[child] ||
          '🍽️';


        childHead.textContent =
          `${childIcon} ${child}`;


        card.appendChild(
          childHead
        );



        /*
          메뉴
        */

        items.forEach(
          (row,index)=>{

            const p =
              document.createElement(
                'div'
              );


            p.className =
              index===0
                ? 'menu-item main-menu'
                : 'menu-item';


            p.innerHTML =
              String(
                row.menu_name || ''
              )
              .replace(
                /\n/g,
                '<br>'
              );


            card.appendChild(p);

          }
        );

      });



    menusEl.appendChild(
      card
    );

  });

}



/* =====================================================
   날짜 선택
===================================================== */

dateSelect.onchange=()=>{

  currentIndex =
    dates.indexOf(
      dateSelect.value
    );


  showDate();

};



/* =====================================================
   이전
===================================================== */

prev.onclick=()=>{

  if(
    currentIndex>0
  ){

    currentIndex--;

    showDate();

  }

};



/* =====================================================
   다음
===================================================== */

next.onclick=()=>{

  if(
    currentIndex<
    dates.length-1
  ){

    currentIndex++;

    showDate();

  }

};



/* =====================================================
   오늘
===================================================== */

todayBtn.onclick=()=>{

  const today =
    todayKey();


  const i =
    dates.indexOf(
      today
    );


  currentIndex =
    i>=0
      ? i
      : dates.length-1;


  showDate();

};



/* =====================================================
   시작
===================================================== */

loadDates()
  .catch(
    e=>{

      menusEl.innerHTML=

        `
        <div class="card">

          Supabase 연결을 확인해주세요.

          <br>

          ${e.message}

        </div>
        `;

    }
  );

</script>

</body>
</html>
